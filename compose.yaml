# VoiceStudio and ReadAloud in one place: `docker compose up -d`.
# Settings come from ./.env (see README "Voices: VoiceStudio"). Both ports stay on loopback.
name: readaloud

services:
  voicestudio:
    image: ghcr.io/debpalash/voicestudio:${VOICESTUDIO_TAG:-stable}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3900"
    environment:
      OMNIVOICE_API_KEY: ${VOICESTUDIO_API_KEY:?set VOICESTUDIO_API_KEY in .env}
      OMNIVOICE_SERVER_MODE: "1"
      OMNIVOICE_ANALYTICS_DISABLED: "1"
      OMNIVOICE_DATA_DIR: /app/omnivoice_data
    volumes:
      - voicestudio-data:/app/omnivoice_data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Bundled into the app at build time; rebuild (`up --build`) after changing them.
      # A provider appears only when its key is set.
      args:
        VITE_DEFAULT_ENGINE: ${VITE_DEFAULT_ENGINE:-kittentts}
        VITE_OPENAI_BASE: ${OPENAI_API_KEY:+/api/oa}
        VITE_OPENAI_TTS_MODEL: ${VITE_OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
        VITE_PATOIS_MODEL: ${VITE_PATOIS_MODEL:-gpt-4.1-mini}
        VITE_FISH_BASE: ${FISH_API_KEY:+/api/fish}
        VITE_FISH_TTS_MODEL: ${VITE_FISH_TTS_MODEL:-s2.1-pro}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4179}:4173"
    # Read by the preview server's proxy only; never bundled.
    environment:
      # VOICESTUDIO_REMOTE_URL points the app at a VoiceStudio on another machine (e.g. a GPU Mac
      # on the tailnet). It is separate from VOICESTUDIO_URL, which `npm run dev` reads from the
      # same .env and which is usually a loopback address that means nothing inside this container.
      VOICESTUDIO_URL: ${VOICESTUDIO_REMOTE_URL:-http://voicestudio:3900}
      VOICESTUDIO_API_KEY: ${VOICESTUDIO_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FISH_API_KEY: ${FISH_API_KEY:-}
      PREPARATION_DATA_DIR: /app/preparations
    volumes:
      - preparation-data:/app/preparations
    depends_on:
      - voicestudio

volumes:
  preparation-data:
  # Fixed name so models downloaded by an earlier `docker run -v voicestudio-data:…` carry over.
  voicestudio-data:
    name: voicestudio-data
