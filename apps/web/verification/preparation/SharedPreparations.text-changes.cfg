\* A finding on the current code, kept as a check that must fail until the code changes.
\* refreshShared forgets a cleared reading as soon as sharedPreparationJobs stops listing it (:117).
\* Editing the document stops the listing, so undoing the edit brings the cleared reading back.
\* ClearedStayCleared fails. When it passes, set TextChanges = TRUE in SharedPreparations.cfg.
SPECIFICATION Spec
CONSTANTS
    NumReadings = 2
    MaxReloads = 2
    TextChanges = TRUE
    HiddenInMemory = FALSE
INVARIANT ClearedStayCleared
