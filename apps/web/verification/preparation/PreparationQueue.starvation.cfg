\* A finding on the current code, kept as a check that must fail until the code changes.
\* A reading whose clip times out goes back to "queued" ahead of readings never sent, so when every
\* save times out, readings that keep failing can take every place and a later reading never reaches
\* the server. QueuedReachServer fails. When it passes, move it into PreparationQueue.cfg.
SPECIFICATION Spec
CONSTANTS
    NumJobs = 3
    NumPassages = 2
    QueueLimit = 1
    SaveConcurrency = 1
    MaxReloads = 2
    SavingHoldsSlot = FALSE
    ClipWaitsForever = FALSE
    RestoreSavingAsQueued = FALSE
    WalkSavedPassages = FALSE
PROPERTIES QueuedReachServer
