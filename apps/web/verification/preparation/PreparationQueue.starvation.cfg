\* t3/save-retry-stays-saving reverted: a reading whose clip times out goes back to "queued" ahead of
\* readings never sent. When every save times out, readings that keep failing take every place and a
\* later reading never reaches the server. QueuedReachServer must fail.
SPECIFICATION Spec
CONSTANTS
    NumJobs = 3
    NumPassages = 2
    QueueLimit = 1
    SaveConcurrency = 1
    MaxReloads = 2
    UnloadFailsClips = FALSE
    SavingHoldsSlot = FALSE
    ClipWaitsForever = FALSE
    RestoreSavingAsQueued = FALSE
    WalkSavedPassages = FALSE
    RetryRequeues = TRUE
PROPERTIES QueuedReachServer
