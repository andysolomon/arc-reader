\* A finding on the current code, kept as a check that must fail until the code changes.
\* A reload fails the clip download in flight, and run()'s catch on the old page persists the reading
\* as "queued" before the page unloads, so the reloaded page sends it back to the server.
\* NoResendAfterReload fails. When it passes, set UnloadFailsClips = TRUE in PreparationQueue.cfg.
SPECIFICATION Spec
CONSTANTS
    NumJobs = 3
    NumPassages = 2
    QueueLimit = 1
    SaveConcurrency = 1
    MaxReloads = 2
    UnloadFailsClips = TRUE
    SavingHoldsSlot = FALSE
    ClipWaitsForever = FALSE
    RestoreSavingAsQueued = FALSE
    WalkSavedPassages = FALSE
INVARIANT NoResendAfterReload
