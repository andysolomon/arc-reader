\* t3/save-retry-stays-saving reverted: run()'s catch puts a saving reading back to "queued". A reload
\* fails the clip download in flight, the old page persists "queued", and the reloaded page sends the
\* reading back to the server. NoResendAfterReload must fail.
SPECIFICATION Spec
CONSTANTS
    NumJobs = 3
    NumPassages = 2
    QueueLimit = 1
    SaveConcurrency = 1
    MaxReloads = 2
    UnloadFailsClips = TRUE
    SavingHoldsSlot = FALSE
    ClipWaitsForever = FALSE
    RestoreSavingAsQueued = FALSE
    WalkSavedPassages = FALSE
    RetryRequeues = TRUE
INVARIANT NoResendAfterReload
