<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#161412" />
    <meta name="description" content="ReadAloud reads anything to you: paste text, a URL or a file and listen." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <title>ReadAloud</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("readaloud:settings");
          var t = raw ? JSON.parse(raw).state.theme : null;
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
      // A page cached by the service worker can outlive a deploy and ask for
      // bundles the server no longer has, leaving a blank page. Drop the
      // service worker and reload once to get the current page.
      addEventListener("error", function (e) {
        var el = e.target;
        var url = el && (el.src || el.href);
        if (!url || !/\/assets\//.test(url) || !/^(SCRIPT|LINK)$/.test(el.tagName)) return;
        try {
          var last = Number(sessionStorage.getItem("readaloud:asset-reload"));
          if (Date.now() - last < 30000) return;
          sessionStorage.setItem("readaloud:asset-reload", String(Date.now()));
        } catch (err) {
          // Without a persistent retry marker, a reload could loop forever.
          return;
        }
        var sw = navigator.serviceWorker;
        var done = function () { location.reload(); };
        if (!sw) return done();
        sw.getRegistrations()
          .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
          .then(done, done);
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
