# Traefik, the cluster's ingress controller. Applied by deploy.sh after readaloud.yaml.
#
# Its Service holds the NodePorts that cluster.yaml maps to the host, so every request
# from 127.0.0.1:4179 (web) and 127.0.0.1:3900 (VoiceStudio) goes through Traefik and
# the Ingress objects in readaloud.yaml pick the backend. Each host port has its own
# entrypoint; an Ingress names the one it serves with the router.entrypoints annotation.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: [services, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: traefik }
subjects: [{ kind: ServiceAccount, name: traefik, namespace: traefik }]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: __TRAEFIK_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --entryPoints.web.address=:8000
            - --entryPoints.voicestudio.address=:3900
            # Traefik stops reading a request after 60 s by default; long uploads over
            # Tailscale need longer, and the NodePort it replaces had no limit.
            - --entryPoints.web.transport.respondingTimeouts.readTimeout=0
            - --entryPoints.voicestudio.transport.respondingTimeouts.readTimeout=0
            - --providers.kubernetesingress.ingressClass=traefik
            - --ping
            - --global.checkNewVersion=false
            - --global.sendAnonymousUsage=false
          ports:
            - { name: web, containerPort: 8000 }
            - { name: voicestudio, containerPort: 3900 }
            - { name: admin, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ping, port: admin }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /ping, port: admin }
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: NodePort
  selector: { app: traefik }
  ports:
    - { name: web, port: 80, targetPort: web, nodePort: 30179 }
    - { name: voicestudio, port: 3900, targetPort: voicestudio, nodePort: 30900 }
