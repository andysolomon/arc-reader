# Single-node kind cluster for ReadAloud. It takes over the ports Docker Compose used,
# so https://omarchy.tail1b9428.ts.net:8449 (tailscale serve → 127.0.0.1:4179) and
# anything using 127.0.0.1:3900 keep working. Data stays in the Compose volumes,
# mounted into the node and exposed to pods as hostPath volumes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: readaloud
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30179, hostPort: 4179, listenAddress: 127.0.0.1, protocol: TCP } # web
      - { containerPort: 30900, hostPort: 3900, listenAddress: 127.0.0.1, protocol: TCP } # VoiceStudio
    extraMounts:
      - { hostPath: /var/lib/docker/volumes/readaloud_library-data/_data, containerPath: /data/library }
      - { hostPath: /var/lib/docker/volumes/readaloud_preparation-data/_data, containerPath: /data/preparations }
      - { hostPath: /var/lib/docker/volumes/voicestudio-data/_data, containerPath: /data/voicestudio }
