name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/ffmpeg
      - run: pnpm check

  # TLA+ model of the audio preparation queue; see .claude/skills/verify-preparation-queue.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: ~/.cache/readaloud/tla2tools-1.7.4
          key: tla2tools-1.7.4
      - run: node apps/web/verification/preparation/check.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/ffmpeg
      - run: pnpm --filter @readaloud/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:cadence
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/*/test-results
          retention-days: 7
