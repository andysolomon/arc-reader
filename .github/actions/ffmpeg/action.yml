name: ffmpeg
description: Put a static ffmpeg and ffprobe on PATH from GitHub releases, not the Ubuntu mirror.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        build=ffmpeg-n8.1-latest-linux64-gpl-8.1
        curl -fsSL --retry 3 --max-time 120 \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$build.tar.xz" \
          | tar -xJ -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$build/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/$build/bin/ffmpeg" -hide_banner -version | head -1
