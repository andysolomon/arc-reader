<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadAloud — how it works (BPMN)</title>
<style>
  :root{
    --bg:#161412; --fg:#ece6dc; --muted:#a39a8e; --faint:#6f675d;
    --card:#1d1a17; --card2:#272320; --line:#342e29; --lane:#1a1715; --strip:#211e1b;
    --accent:#d9955a; --accent-fg:#1c120a; --accent-soft:rgba(217,149,90,.16);
    --start:#3fa77a; --end:#d0614f; --gw:#c9a043; --msg:#6fa0e0; --data:#8f8577;
    --task:#211e1b; --task-stroke:#5b5249; --shape-fill:#1d1a17;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --serif:Literata,Georgia,serif;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f7f3ec; --fg:#2a241f; --muted:#6c6258; --faint:#9c9286;
    --card:#fffdf9; --card2:#efe9df; --line:#ddd4c7; --lane:#fbf8f3; --strip:#f1ebe2;
    --accent:#b8692b; --accent-fg:#fff; --accent-soft:rgba(184,105,43,.13);
    --start:#2a8a5f; --end:#b8473a; --gw:#a07c1f; --msg:#3a6fb5; --data:#857a6c;
    --task:#fffdf9; --task-stroke:#a99d8f; --shape-fill:#fffdf9;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
  button,select{font:inherit;color:inherit}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  header h1{font:500 19px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
  header h1 small{display:block;font:12px var(--sans);color:var(--muted);letter-spacing:0;margin-top:2px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button,.btn{background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
  .tabs button:hover,.btn:hover{color:var(--fg);background:var(--card2)}
  .tabs button[aria-selected="true"]{color:var(--fg);background:var(--card2);border-color:var(--line)}
  .tabs button .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line);font-size:11px;margin-right:6px;color:var(--fg)}
  .tabs button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-fg)}
  .tools{margin-left:auto;display:flex;gap:4px;align-items:center}
  .btn.solid{border-color:var(--line);color:var(--fg)}
  main{display:grid;grid-template-columns:1fr 360px;min-height:0}
  #stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:
    radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px}
  #svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;font-family:var(--sans)}
  #svg.drag{cursor:grabbing}
  .crumb{position:absolute;left:14px;top:12px;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 12px;backdrop-filter:blur(6px);max-width:calc(100% - 28px)}
  .crumb button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
  .crumb b{color:var(--fg);font-weight:600}
  .zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px}
  .zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;line-height:1}
  .zoom button:hover{border-color:var(--accent)}
  aside{border-left:1px solid var(--line);overflow:auto;padding:16px 18px 24px;background:var(--card)}
  aside h2{font:500 20px/1.25 var(--serif);margin:2px 0 8px}
  aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:600}
  aside p{margin:0 0 10px}
  aside ul{margin:0;padding-left:18px}
  aside li{margin:3px 0}
  .kind{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .kind i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .code{display:flex;flex-direction:column;gap:4px}
  .code button{all:unset;cursor:pointer;font:12px var(--mono);background:var(--card2);border-radius:6px;padding:4px 8px;word-break:break-all}
  .code button:hover{outline:1px solid var(--accent)}
  .code button.ok::after{content:"  copied";color:var(--accent)}
  .links{display:flex;flex-wrap:wrap;gap:6px}
  .links button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer;text-align:left}
  .links button:hover{border-color:var(--accent)}
  .links button small{color:var(--muted)}
  .drill{margin-top:12px;width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}
  .hint{color:var(--muted);font-size:13px}
  .hint kbd{font:11.5px var(--mono);background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .legend{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;font-size:12.5px}
  .legend svg{width:44px;height:30px;overflow:visible}
  footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 14px;border-top:1px solid var(--line);background:var(--card)}
  footer label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
  footer select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:300px}
  footer .btn{border-color:var(--line);color:var(--fg)}
  footer .btn.play{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
  #say{flex:1 1 320px;min-width:220px;font-size:13.5px;display:flex;gap:10px;align-items:baseline}
  #say .k{font:12px var(--mono);color:var(--muted);white-space:nowrap}
  @media (max-width:900px){
    body{overflow:auto;grid-template-rows:auto auto auto}
    main{grid-template-columns:1fr;grid-template-rows:62vh auto}
    aside{border-left:0;border-top:1px solid var(--line)}
  }

  /* ---- diagram ---- */
  .pool-rect{fill:var(--lane);stroke:var(--task-stroke);stroke-width:1.2}
  .pool-strip,.lane-strip{fill:var(--strip);stroke:var(--task-stroke);stroke-width:1}
  .lane-rect{fill:transparent;stroke:var(--line);stroke-width:1}
  .bb .pool-rect{fill:var(--card2)}
  .pool-label{fill:var(--fg);font-weight:600}
  .lane-label{fill:var(--muted);font-weight:500}
  .pool-hit{cursor:pointer}
  .pool-hit:hover .pool-strip,.pool-hit:hover .lane-strip,.bb.pool-hit:hover .pool-rect{fill:var(--accent-soft)}
  .esp{fill:none;stroke:var(--task-stroke);stroke-width:1.3;stroke-dasharray:6 4}
  .esp-label{fill:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .flow{fill:none;stroke:var(--faint);stroke-width:1.5}
  .flow.msg{stroke:var(--msg);stroke-dasharray:7 5;stroke-width:1.3}
  .flow.data{stroke:var(--data);stroke-dasharray:2 4;stroke-width:1.4}
  .flow-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
  .flow-label{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
  .flow.msg + .flow-label,.flow-label.msg{fill:var(--msg)}
  .mk-seq{fill:var(--faint)} .mk-msg{fill:var(--lane);stroke:var(--msg);stroke-width:1.2} .mk-data{fill:none;stroke:var(--data);stroke-width:1.4}
  .mk-hi{fill:var(--accent)}
  .el{cursor:pointer}
  .el .shape{fill:var(--shape-fill);stroke:var(--task-stroke);stroke-width:1.5;transition:stroke .15s,fill .15s}
  .el.task .shape{fill:var(--task)}
  .el.call .shape{stroke-width:3.2}
  .el.start .shape{stroke:var(--start);stroke-width:2}
  .el.end .shape{stroke:var(--end);stroke-width:3.6}
  .el.catch .shape,.el.boundary .shape{stroke:var(--gw);stroke-width:1.4}
  .el.gw .shape{stroke:var(--gw);stroke-width:1.6}
  .el.store .shape{stroke:var(--data);stroke-width:1.4}
  .el.ni .shape{stroke-dasharray:4 3}
  .icon{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
  .icon.fill{fill:var(--muted)}
  .el.end .icon.fill{fill:var(--end);stroke:var(--end)}
  .el.gw .icon{stroke:var(--gw);stroke-width:3}
  .marker{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-linecap:round}
  .label{fill:var(--fg)}
  .sublabel{fill:var(--muted)}
  .el:hover .shape{stroke:var(--accent)}
  .sel .shape,.sel .pool-rect{stroke:var(--accent)!important;stroke-width:3!important}
  .flow.sel{stroke:var(--accent)!important;stroke-width:2.6}
  .flow.near{stroke:var(--accent);opacity:.85}
  .visited .shape{fill:var(--accent-soft)!important}
  .flow.visited{stroke:var(--accent);opacity:.75}
  .active .shape{stroke:var(--accent)!important;stroke-width:3.2!important;filter:drop-shadow(0 0 7px var(--accent))}
  .bb.active .pool-rect{stroke:var(--accent);stroke-width:2.5;fill:var(--accent-soft)}
  .token{fill:var(--accent);stroke:var(--bg);stroke-width:2;filter:drop-shadow(0 0 6px var(--accent))}
  .token.msg{fill:var(--msg);filter:drop-shadow(0 0 6px var(--msg))}
  .dim .el:not(.visited):not(.active),.dim .flow:not(.visited){opacity:.38}
</style>
</head>

<footer>
  <label>Walk through <select id="scen"></select></label>
  <button class="btn play" id="play">▶ Play</button>

/* ---------- geometry ---------- */
function build(id) {
  const D = DIAGRAMS[id];
  const E = {};
  for (const p of D.pools) {
    let y = p.y;
    if (!p.bb) {
      p.h = p.h || p.lanes.reduce((s, l) => s + l.h, 0);
      for (const l of p.lanes) {
        Object.assign(l, { kind: "lane", pool: p.id, x: p.x + 30, y, w: p.w - 30 });
        E[l.id] = Object.assign(l, { cx: l.x + l.w / 2, cy: y + l.h / 2, hw: l.w / 2, hh: l.h / 2 });
        y += l.h;
      }
    }
    E[p.id] = Object.assign(p, { kind: "pool", cx: p.x + p.w / 2, cy: p.y + p.h / 2, hw: p.w / 2, hh: p.h / 2 });
  }
  for (const s of D.esps) E[s.id] = Object.assign(s, { kind: "esp", t: "esp", cx: s.x + s.w / 2, cy: s.y + s.h / 2, hw: s.w / 2, hh: s.h / 2 });
  for (const n of D.nodes) {
    const [w, h] = [n.w || SIZE[n.t][0], n.h || SIZE[n.t][1]];
    n.w = w; n.h = h; n.kind = "node";
    E[n.id] = n;
  }
  for (const n of D.nodes) {
    if (n.t === "boundary") {
      const host = E[n.on];
      n.x = host.x + (n.dx || 0);
      n.y = host.y + (n.side === "top" ? -host.h / 2 : host.h / 2);
      n.lane = host.lane; n.pool = host.pool;
    }
    Object.assign(n, { cx: n.x, cy: n.y, hw: n.w / 2, hh: n.h / 2 });
    if (!n.pool && n.lane) n.pool = E[n.lane].pool;
  }
  for (const s of D.esps) s.pool = E[s.lane].pool;
  const seen = {};
  const flows = D.flows.map((fl) => {
    const k = fl.k || "seq";
    let fid = `F_${fl.f}_${fl.to}`;
    seen[fid] = (seen[fid] || 0) + 1;
    if (seen[fid] > 1) fid += `_${seen[fid]}`;
    return { ...fl, k, id: fl.id || fid, pts: route(fl, E) };
  });
  return { D, E, flows };
}

function clip(n, p) {
  const dx = p[0] - n.cx, dy = p[1] - n.cy;
  if (!dx && !dy) return [n.cx, n.cy];
  if (Math.abs(dx) * n.hh > Math.abs(dy) * n.hw) return [n.cx + Math.sign(dx) * n.hw, n.cy + dy * (n.hw / Math.abs(dx))];
  return [n.cx + dx * (n.hh / Math.abs(dy)), n.cy + Math.sign(dy) * n.hh];
}
const edgeY = (pool, otherY) => (otherY < pool.y ? pool.y : pool.y + pool.h);

function route(fl, E) {
  const a = E[fl.f], b = E[fl.to];
  const A = fl.fp || [a.cx, a.cy], B = fl.tp || [b.cx, b.cy];
  let mids = fl.wp ? fl.wp.slice() : [];
  if (!fl.wp && a.kind !== "pool" && b.kind !== "pool") {
    let r = fl.r;
    if (!r && fl.k !== "data" && A[0] !== B[0] && A[1] !== B[1]) r = ["hvh", (A[0] + B[0]) / 2];
    if (r === "hv") mids = [[B[0], A[1]]];
    else if (r === "vh") mids = [[A[0], B[1]]];
    else if (r && r[0] === "hvh") mids = [[r[1], A[1]], [r[1], B[1]]];
    else if (r && r[0] === "vhv") mids = [[A[0], r[1]], [B[0], r[1]]];
  }
  let s = fl.fp, e = fl.tp;
  if (!s && a.kind === "pool") s = [(mids[0] || e || [b.cx])[0], edgeY(a, b.cy)];
  if (!e && b.kind === "pool") e = [(mids[mids.length - 1] || s || [a.cx])[0], edgeY(b, a.cy)];
  s = s || clip(a, mids[0] || e || B);
  e = e || clip(b, mids[mids.length - 1] || s);
  return [s, ...mids, e].map(([x, y]) => [Math.round(x * 10) / 10, Math.round(y * 10) / 10]);
}

function bounds(G) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const e of Object.values(G.E)) { add(e.cx - e.hw, e.cy - e.hh); add(e.cx + e.hw, e.cy + e.hh + (e.t === "store" ? 30 : 0)); }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

/* ---------- BPMN 2.0 XML export ---------- */
function xesc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function toBPMN(id) {
  const G = build(id), { D, E, flows } = G;
  const out = [];
  const w = (depth, s) => out.push("  ".repeat(depth) + s);
  const name = (n) => (n ? ` name="${xesc(n)}"` : "");
  const doc = (depth, el) => { if (el.d) w(depth, `<bpmn:documentation>${xesc(el.d + (el.code ? "\n" + el.code.join("\n") : ""))}</bpmn:documentation>`); };
  const seq = flows.filter((f) => f.k === "seq"), msg = flows.filter((f) => f.k === "msg"), data = flows.filter((f) => f.k === "data");
  const TAG = { start: "startEvent", end: "endEvent", catch: "intermediateCatchEvent", boundary: "boundaryEvent", call: "callActivity", store: "dataStoreReference" };
  const TASK = { user: "userTask", service: "serviceTask", send: "sendTask", receive: "receiveTask", script: "scriptTask" };
  const GW = { x: "exclusiveGateway", "+": "parallelGateway", o: "inclusiveGateway" };
  const tagOf = (n) => n.t === "task" ? TASK[n.k] || "task" : n.t === "gw" ? GW[n.g] : TAG[n.t];
  const evDef = (depth, n) => {
    if (n.ev === "message") w(depth, `<bpmn:messageEventDefinition id="${n.id}_def" />`);
    if (n.ev === "timer") w(depth, `<bpmn:timerEventDefinition id="${n.id}_def" />`);
    if (n.ev === "error") w(depth, `<bpmn:errorEventDefinition id="${n.id}_def" />`);
    if (n.ev === "conditional") { w(depth, `<bpmn:conditionalEventDefinition id="${n.id}_def">`); w(depth + 1, `<bpmn:condition xsi:type="bpmn:tFormalExpression" />`); w(depth, `</bpmn:conditionalEventDefinition>`); }
  };
  const node = (depth, n) => {
    const tag = tagOf(n);
    let attrs = `id="${n.id}"${name(n.n)}`;
    if (n.t === "boundary") attrs += ` attachedToRef="${n.on}"`;
    if (n.t === "call") attrs += ` calledElement="Process_${n.ref}"`;
    if (n.t === "start" && n.ni) attrs += ` isInterrupting="false"`;
    const dflt = seq.find((f) => f.f === n.id && f.def);
    if (n.t === "gw" && n.g !== "+" && dflt) attrs += ` default="${dflt.id}"`;
    if (n.t === "store") { w(depth, `<bpmn:${tag} ${attrs} />`); return; }
    w(depth, `<bpmn:${tag} ${attrs}>`);
    doc(depth + 1, n);
    for (const f of seq.filter((f) => f.to === n.id)) w(depth + 1, `<bpmn:incoming>${f.id}</bpmn:incoming>`);
    for (const f of seq.filter((f) => f.f === n.id)) w(depth + 1, `<bpmn:outgoing>${f.id}</bpmn:outgoing>`);
    const ins = data.filter((f) => f.to === n.id), outs = data.filter((f) => f.f === n.id);
    if (ins.length) w(depth + 1, `<bpmn:property id="${n.id}_prop" name="__targetRef_placeholder" />`);
    for (const f of ins) { w(depth + 1, `<bpmn:dataInputAssociation id="${f.id}">`); w(depth + 2, `<bpmn:sourceRef>${f.f}</bpmn:sourceRef>`); w(depth + 2, `<bpmn:targetRef>${n.id}_prop</bpmn:targetRef>`); w(depth + 1, `</bpmn:dataInputAssociation>`); }
    for (const f of outs) { w(depth + 1, `<bpmn:dataOutputAssociation id="${f.id}">`); w(depth + 2, `<bpmn:targetRef>${f.to}</bpmn:targetRef>`); w(depth + 1, `</bpmn:dataOutputAssociation>`); }
    if (n.m === "loop") w(depth + 1, `<bpmn:standardLoopCharacteristics />`);
    if (n.m === "seq") w(depth + 1, `<bpmn:multiInstanceLoopCharacteristics isSequential="true" />`);
    if (n.m === "par") w(depth + 1, `<bpmn:multiInstanceLoopCharacteristics />`);
    evDef(depth + 1, n);
    w(depth, `</bpmn:${tag}>`);
  };
  const seqFlow = (depth, f) => w(depth, `<bpmn:sequenceFlow id="${f.id}"${name(f.n)} sourceRef="${f.f}" targetRef="${f.to}" />`);

  w(0, `<?xml version="1.0" encoding="UTF-8"?>`);
  w(0, `<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" id="Definitions_${id}" targetNamespace="https://github.com/andysolomon/arc-reader/readaloud" exporter="ReadAloud docs/readaloud-bpmn.html" exporterVersion="1">`);
  w(1, `<bpmn:collaboration id="Collaboration_${id}">`);
  w(2, `<bpmn:documentation>${xesc(D.title + " — " + D.sub)}</bpmn:documentation>`);
  // The first owned pool's process is named after the diagram, so call activities can reference it.
  const firstOwned = D.pools.find((q) => !q.bb).id;
  const processOf = (p) => `Process_${p.id === firstOwned ? id : p.id}`;
  for (const p of D.pools) {
    w(2, `<bpmn:participant id="${p.id}"${name(p.n)}${p.bb ? "" : ` processRef="${processOf(p)}"`}>`);
    doc(3, p);
    w(2, `</bpmn:participant>`);
  }
  for (const f of msg) w(2, `<bpmn:messageFlow id="${f.id}"${name(f.n)} sourceRef="${f.f}" targetRef="${f.to}" />`);
  w(1, `</bpmn:collaboration>`);

  for (const p of D.pools.filter((q) => !q.bb)) {
    w(1, `<bpmn:process id="${processOf(p)}"${name(p.id === firstOwned ? D.title : p.n)} isExecutable="false">`);
    const top = D.nodes.filter((n) => n.pool === p.id && !n.parent);
    const espHere = D.esps.filter((s) => s.pool === p.id);
    if (p.lanes.length) {
      w(2, `<bpmn:laneSet id="LaneSet_${p.id}">`);
      for (const l of p.lanes) {
        w(3, `<bpmn:lane id="${l.id}"${name(l.n)}>`);
        for (const n of [...top.filter((n) => n.lane === l.id && n.t !== "store"), ...espHere.filter((s) => s.lane === l.id)]) w(4, `<bpmn:flowNodeRef>${n.id}</bpmn:flowNodeRef>`);
        w(3, `</bpmn:lane>`);

      w(2, `</bpmn:laneSet>`);
    }
    for (const n of top) node(2, n);
    for (const s of espHere) {
      w(2, `<bpmn:subProcess id="${s.id}"${name(s.n)} triggeredByEvent="true">`);
      doc(3, s);
      const kids = D.nodes.filter((n) => n.parent === s.id);
      for (const n of kids) node(3, n);
      for (const f of seq.filter((f) => E[f.f].parent === s.id)) seqFlow(3, f);
      w(2, `</bpmn:subProcess>`);

    return k;
  }
  function flowKind(f) { return f.k === "msg" ? "Message flow (between participants)" : f.k === "data" ? "Data association" : f.def ? "Sequence flow · default" : "Sequence flow"; }
  const label = (el) => el.n || (el.t === "gw" ? (el.g === "+" ? "Parallel gateway" : "Merge") : el.t === "end" ? "End" : el.id);
  function codeList(code) {
    if (!code || !code.length) return "";
    return `<h3>In the code</h3><div class="code">${code.map((c) => `<button title="Copy path" data-copy="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  }
  function linkBtn(id, prefix) {
    const el = S.G.E[id];
    return `<button data-sel="${id}"><small>${prefix}</small> ${esc(label(el))}</button>`;
  }
  function select(id, { pan = false } = {}) {
    root.querySelectorAll(".sel").forEach((n) => n.classList.remove("sel"));
    root.querySelectorAll(".near").forEach((n) => n.classList.remove("near"));
    root.querySelectorAll('.flow[marker-end="url(#m-seq-hi)"]').forEach((p) => p.setAttribute("marker-end", "url(#m-seq)"));
    S.sel = id;
    if (!id) { showOverview(); return; }
    const flow = S.G.flows.find((f) => f.id === id);
    if (flow) {
      const p = document.getElementById("path-" + id);
      p.classList.add("sel");
      if (flow.k === "seq") p.setAttribute("marker-end", "url(#m-seq-hi)");
      panel.innerHTML = `<span class="kind"><i style="background:var(--${flow.k === "msg" ? "msg" : flow.k === "data" ? "data" : "faint"})"></i>${flowKind(flow)}</span>
        <h2>${esc(flow.n || label(S.G.E[flow.f]) + " → " + label(S.G.E[flow.to]))}</h2>
        <h3>Connects</h3><div class="links">${linkBtn(flow.f, "from")}${linkBtn(flow.to, "to")}</div>`;
      return;
    }
    const el = S.G.E[id];
    if (!el) return;
    root.querySelector(`[data-id="${id}"]`)?.classList.add("sel");
    const inc = S.G.flows.filter((f) => f.to === id), out = S.G.flows.filter((f) => f.f === id);
    for (const f of [...inc, ...out]) {
      const p = document.getElementById("path-" + f.id);
      p?.classList.add("near");
      if (f.k === "seq") p?.setAttribute("marker-end", "url(#m-seq-hi)");
    }
    const where = el.kind === "lane" ? S.G.E[el.pool].n : el.lane ? `${S.G.E[el.lane].n}` : el.pool && S.G.E[el.pool] ? S.G.E[el.pool].n : "";
    const host = el.t === "boundary" ? `<p class="hint">Attached to <b>${esc(label(S.G.E[el.on]))}</b>${el.ni ? "; it does not cancel it" : "; it interrupts it"}.</p>` : "";
    const parent = el.parent ? `<p class="hint">Inside the event sub-process <b>${esc(S.G.E[el.parent].n)}</b>.</p>` : "";
    const fl = (f, dir) => {
      const other = S.G.E[dir === "in" ? f.f : f.to];
      const tag = f.k === "msg" ? (dir === "in" ? "message from" : "message to") : f.k === "data" ? (dir === "in" ? "reads" : "writes") : dir === "in" ? "from" : f.n ? f.n + " →" : "next";
      return `<button data-sel="${other.id}"><small>${esc(tag)}</small> ${esc(label(other))}</button>`;
    };
    const links = inc.length + out.length ? `<h3>Connections</h3><div class="links">${inc.map((f) => fl(f, "in")).join("")}${out.map((f) => fl(f, "out")).join("")}</div>` : "";
    const facts = el.facts ? `<h3>Numbers</h3><ul>${el.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : "";
    const drill = el.t === "call" ? `<button class="drill" data-open="${el.ref}">Open “${esc(DIAGRAMS[el.ref].title)}” ›</button>` : "";
    panel.innerHTML = `<span class="kind"><i style="background:var(--${el.t === "start" ? "start" : el.t === "end" ? "end" : el.t === "gw" || el.t === "catch" || el.t === "boundary" ? "gw" : el.t === "store" ? "data" : el.bb ? "msg" : "accent"})"></i>${esc(kindOf(el))}</span>
      <h2>${esc(label(el))}</h2>
      ${where ? `<p class="hint">${esc(where)}</p>` : ""}${host}${parent}
      ${el.d ? `<p>${esc(el.d)}</p>` : ""}${facts}${codeList(el.code)}${links}${drill}`;
    if (pan) focusOn(el, view().k);
  }
  panel.addEventListener("click", (e) => {
    const s = e.target.closest("[data-sel]"), o = e.target.closest("[data-open]"), c = e.target.closest("[data-copy]"), sc = e.target.closest("[data-scen]");
    if (s) select(s.dataset.sel, { pan: true });
    if (o) open(o.dataset.open);
    if (sc) { document.getElementById("scen").value = sc.dataset.scen; startRun(); }
    if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => { c.classList.add("ok"); setTimeout(() => c.classList.remove("ok"), 1200); }).catch(() => {}); }
  });

  function showOverview() {
    const D = DIAGRAMS[S.cur];
    const calls = D.nodes.filter((n) => n.t === "call");
    panel.innerHTML = `<span class="kind"><i></i>Process ${ORDER.indexOf(S.cur) + 1} of ${ORDER.length}</span>
      <h2>${esc(D.title)}</h2><p>${esc(D.sub)}</p>
      ${D.overview.map((p) => `<p class="hint">${esc(p)}</p>`).join("")}
      <h3>Walkthroughs</h3><div class="links">${D.scenarios.map((s) => `<button data-scen="${s.id}">▶ ${esc(s.n)}</button>`).join("")}</div>
      ${calls.length ? `<h3>Sub-processes</h3><div class="links">${calls.map((c) => `<button data-open="${c.ref}">${esc(c.n)} ›</button>`).join("")}</div>` : D.parent ? `<h3>Called from</h3><div class="links"><button data-open="${D.parent}">‹ ${esc(DIAGRAMS[D.parent].title)}</button></div>` : ""}
      <h3>Getting around</h3>
      <p class="hint">Click a shape for what it does and where it lives in the code. Double-click a thick-bordered call activity to open it. Drag to pan, scroll to zoom, <kbd>0</kbd> fits, <kbd>Esc</kbd> clears, <kbd>→</kbd> steps a walkthrough.</p>`;
  }

  /* ---------- legend ---------- */
  function legendHTML() {
    const mini = (inner) => `<svg viewBox="-22 -15 44 30">${inner}</svg>`;
    const fake = (o) => nodeSVG(Object.assign({ x: 0, y: 0, n: "", hw: 18, hh: 18, w: 36, h: 36 }, o));
    const rows = [
      [fake({ t: "start" }), "Start event — where a process begins"],
      [fake({ t: "start", ev: "message" }), "Message start — begins when something arrives (a share, a request)"],
      [fake({ t: "start", ev: "message", ni: true }), "Non-interrupting start of an event sub-process"],
      [fake({ t: "end" }), "End event"],
      [fake({ t: "end", ev: "error" }), "Error end — throws an error to the caller"],
      [fake({ t: "boundary", ev: "error" }), "Error boundary event — catches an error on the task it is attached to"],
      [fake({ t: "catch", ev: "timer" }), "Timer / conditional catch — waits"],
      [`<rect class="shape" x="-20" y="-13" width="40" height="26" rx="6" style="fill:var(--task);stroke:var(--task-stroke);stroke-width:1.5"/>`, "Task (icons: person = user, gear = service, envelope = send / receive, scroll = script)"],
      [`<rect class="shape" x="-20" y="-13" width="40" height="26" rx="6" style="fill:var(--task);stroke:var(--task-stroke);stroke-width:3"/><rect class="marker" x="-4.5" y="2" width="9" height="9"/><path class="marker" d="M-2.5,6.5 h5 M0,4 v5"/>`, "Call activity — runs another process (open it)"],
      [`<rect class="shape" x="-20" y="-13" width="40" height="26" rx="6" style="fill:var(--task);stroke:var(--task-stroke);stroke-width:1.5"/><path class="marker" d="M-8,4 h16 M-8,7 h16 M-8,10 h16"/>`, "Markers: ≡ sequential for each item, ⦀ parallel for each item, ↻ loop"],
      [fake({ t: "gw", g: "x", w: 30, h: 30 }), "Exclusive gateway — exactly one path (or a merge)"],
      [fake({ t: "gw", g: "+", w: 30, h: 30 }), "Parallel gateway — all paths at once"],
      [fake({ t: "gw", g: "o", w: 30, h: 30 }), "Inclusive gateway — one or more paths"],
      [`<path class="flow" d="M-20,0 H16" marker-end="url(#m-seq)"/>`, "Sequence flow (slash = default path)"],
      [`<path class="flow msg" d="M-18,0 H16" marker-start="url(#m-msg-start)" marker-end="url(#m-msg-end)"/>`, "Message flow — a request between participants"],
      [`<path class="flow data" d="M-20,0 H16" marker-end="url(#m-data)"/>`, "Data association — reads or writes a store"],
      [fake({ t: "store", w: 30, h: 28 }), "Data store (IndexedDB, disk)"],
    ];
    return `<span class="kind"><i></i>Notation</span><h2>Reading BPMN</h2>
      <p class="hint">Pools are participants (the browser app, the app server); lanes split a pool by responsibility. Grey pools are black boxes: external systems whose insides aren’t modelled.</p>
      <div class="legend">${rows.map(([s, t]) => `${mini(s)}<span>${esc(t)}</span>`).join("")}</div>
      <p class="hint" style="margin-top:14px">Click anywhere on the diagram to close.</p>`;
  }
  document.getElementById("legendBtn").onclick = () => { select(null); panel.innerHTML = legendHTML(); };

  /* ---------- tabs, download, theme ---------- */
  document.getElementById("tabs").innerHTML = ORDER.map((id, i) => `<button role="tab" data-id="${id}"><span class="n">${i + 1}</span>${esc(DIAGRAMS[id].title)}</button>`).join("");
  document.getElementById("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { stopRun(); open(b.dataset.id); } });
  function open(id) { if (id !== S.cur) render(id); }
  document.getElementById("dl").onclick = () => {
    const xml = toBPMN(S.cur);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([xml], { type: "application/xml" }));
    a.download = `readaloud-${S.cur}.bpmn`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const themeKey = "readaloud-bpmn-theme";
  const setTheme = (t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem(themeKey, t); } catch {} };
  let saved = null; try { saved = localStorage.getItem(themeKey); } catch {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  document.getElementById("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

  /* ---------- walkthroughs ---------- */
  const scenSel = document.getElementById("scen"), playBtn = document.getElementById("play"), stepBtn = document.getElementById("step");
  const sayK = document.getElementById("sayk"), sayT = document.getElementById("sayt");
  function fillScenarios() {
    if (S.run) return;
    scenSel.innerHTML = DIAGRAMS[S.cur].scenarios.map((s) => `<option value="${s.id}">${esc(s.n)}</option>`).join("");
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function gate(run) {
    if (run.playing) return Promise.resolve();
    return new Promise((r) => { run.wake = r; });
  }
  function wake(run) { const w = run.wake; run.wake = null; w?.(); }
  function animate(pts, cls, run) {
    const layer = document.getElementById("layer-token");
    const tok = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    tok.setAttribute("r", "7"); tok.setAttribute("class", "token " + cls);
    layer.appendChild(tok);
    const seg = []; let L = 0;
    for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); L += l; }
    const ms = Math.max(260, Math.min(1500, L * 1.25)), t0 = performance.now();
    return new Promise((res) => {
      const frame = (t) => {
        if (run.dead) { tok.remove(); return res(); }
        let d = Math.min(1, (t - t0) / ms) * L, i = 0;
        while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
        const u = seg[i] ? d / seg[i] : 1;
        tok.setAttribute("cx", pts[i][0] + (pts[i + 1][0] - pts[i][0]) * u);
        tok.setAttribute("cy", pts[i][1] + (pts[i + 1][1] - pts[i][1]) * u);
        if (t - t0 < ms) requestAnimationFrame(frame); else { tok.remove(); res(); }
      };
      requestAnimationFrame(frame);
    });
  }
  function mark(id) {
    (S.visit[S.cur] ||= new Set()).add(id);
    root.classList.add("dim");
    root.querySelectorAll(".active").forEach((n) => n.classList.remove("active"));
    const g = root.querySelector(`[data-id="${id}"]`);
    g?.classList.add("visited", "active");
  }
  async function walk(diag, scId, run) {
    if (S.cur !== diag) { render(diag); await sleep(250); }
    const sc = DIAGRAMS[diag].scenarios.find((s) => s.id === scId);
    let prev = null;
    for (let i = 0; i < sc.steps.length; i++) {
      if (run.dead) return;
      const st = sc.steps[i];
      // Paused or stepping: wait for Play or the next Step (the very first step runs at once).
      if (run.count > 0) await gate(run);
      if (run.dead) return;
      const el = S.G.E[st.at];
      const f = prev && S.G.flows.find((x) => x.f === prev && x.to === st.at && x.k !== "data");
      // A wide pool is focused where the message lands, not at its centre.
      const end = f && f.pts[f.pts.length - 1];
      await focusOn(el.kind === "pool" && end ? { cx: end[0], cy: end[1] } : el, 0.72);
      if (f) {
        (S.visit[S.cur] ||= new Set()).add(f.id);
        document.getElementById("path-" + f.id)?.classList.add("visited");
        await animate(f.pts, f.k === "msg" ? "msg" : "", run);
      }
      if (run.dead) return;
      mark(st.at);
      run.count++;
      sayK.textContent = `${DIAGRAMS[diag].title} · ${i + 1}/${sc.steps.length}`;
      sayT.className = ""; sayT.textContent = st.say || label(el);
      if (S.sel !== st.at) select(st.at);
      await sleep(run.playing ? (st.say ? 1500 : 650) : 0);
      if (st.call && document.getElementById("follow").checked && !run.dead) {
        await walk(st.call, st.sc, run);
        if (run.dead) return;
        render(diag); await sleep(200);
        mark(st.at);
        await focusOn(el, 0.72);
      }
      prev = st.at;
    }
  }
  function stopRun() {
    if (!S.run) return;
    S.run.dead = true; wake(S.run); S.run = null;
    playBtn.textContent = "▶ Play"; scenSel.disabled = false;
  }
  function startRun(playing = true) {
    stopRun();
    // Read the choice first: render() refills the list.
    const home = S.cur, sc = scenSel.value;
    S.visit = {};
    render(S.cur);
    scenSel.value = sc;
    const run = { dead: false, playing, wake: null, count: 0 };
    S.run = run;
    scenSel.disabled = true;
    playBtn.textContent = playing ? "❚❚ Pause" : "▶ Play";
    walk(home, sc, run).then(() => {
      if (run.dead) return;
      S.run = null; scenSel.disabled = false; playBtn.textContent = "▶ Play";
      root.querySelectorAll(".active").forEach((n) => n.classList.remove("active"));
      sayK.textContent = "Done"; sayT.textContent = "Walkthrough finished — visited shapes stay highlighted. Reset to clear.";
      if (S.cur !== home) render(home);
      scenSel.value = sc;
    });
  }
  playBtn.onclick = () => {
    if (!S.run) return startRun(true);
    S.run.playing = !S.run.playing;
    playBtn.textContent = S.run.playing ? "❚❚ Pause" : "▶ Play";
    if (S.run.playing) wake(S.run);
  };
  stepBtn.onclick = () => {
    if (!S.run) return startRun(false);
    S.run.playing = false; playBtn.textContent = "▶ Play";
    wake(S.run);
  };
  document.getElementById("reset").onclick = () => {
    stopRun(); S.visit = {};
    sayK.textContent = ""; sayT.className = "hint"; sayT.textContent = "Pick a walkthrough and press Play, or click any shape.";
    render(S.cur);
  };
  window.addEventListener("keydown", (e) => {
    if (e.target.closest?.("select,input")) return;
    if (e.key === "Escape") select(null);
    else if (e.key === "0") fit();
    else if (e.key === "+" || e.key === "=") document.getElementById("zin").click();
    else if (e.key === "-") document.getElementById("zout").click();
    else if (e.key === "ArrowRight") { e.preventDefault(); stepBtn.click(); }
    else if (e.key === " ") { e.preventDefault(); playBtn.click(); }
  });

  render("main");
})();
</script>
</body>
</html>
