<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadAloud — how it works (sequence diagrams)</title>
<style>
  :root{
    --bg:#161412; --fg:#ece6dc; --muted:#a39a8e; --faint:#6f675d;
    --card:#1d1a17; --card2:#272320; --line:#342e29; --strip:#211e1b;
    --accent:#d9955a; --accent-fg:#1c120a; --accent-soft:rgba(217,149,90,.16);
    --browser:#3fa77a; --server:#c9a043; --net:#6fa0e0;
    --stroke:#5b5249; --note:#3a3322;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --serif:Literata,Georgia,serif;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f7f3ec; --fg:#2a241f; --muted:#6c6258; --faint:#9c9286;
    --card:#fffdf9; --card2:#efe9df; --line:#ddd4c7; --strip:#f1ebe2;
    --accent:#b8692b; --accent-fg:#fff; --accent-soft:rgba(184,105,43,.13);
    --browser:#2a8a5f; --server:#a07c1f; --net:#3a6fb5;
    --stroke:#a99d8f; --note:#fbf1cf;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
  button,select{font:inherit;color:inherit}
  a{color:var(--accent)}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  header h1{font:500 19px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
  header h1 small{display:block;font:12px var(--sans);color:var(--muted);letter-spacing:0;margin-top:2px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button,.btn{background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap;text-decoration:none}
  .tabs button:hover,.btn:hover{color:var(--fg);background:var(--card2)}
  .tabs button[aria-selected="true"]{color:var(--fg);background:var(--card2);border-color:var(--line)}
  .tabs button .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line);font-size:11px;margin-right:6px;color:var(--fg)}
  .tabs button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-fg)}
  .tools{margin-left:auto;display:flex;gap:4px;align-items:center}
  .btn.solid{border-color:var(--line);color:var(--fg)}
  main{display:grid;grid-template-columns:1fr 360px;min-height:0}
  #stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:
    radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px}
  #svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;font-family:var(--sans)}
  #svg.drag{cursor:grabbing}
  .crumb{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 12px;backdrop-filter:blur(6px);max-width:calc(100% - 80px)}
  .crumb:empty{display:none}
  .crumb b{color:var(--fg);font-weight:600}
  .zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px}
  .zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;line-height:1}
  .zoom button:hover{border-color:var(--accent)}
  aside{border-left:1px solid var(--line);overflow:auto;padding:16px 18px 24px;background:var(--card)}
  aside h2{font:500 20px/1.25 var(--serif);margin:2px 0 8px;overflow-wrap:anywhere}
  aside h2 code{font:500 16px/1.35 var(--mono)}
  aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:600}
  aside p{margin:0 0 10px}
  aside ul{margin:0;padding-left:18px}
  aside li{margin:3px 0}
  .kind{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .kind i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .kind.net i{background:var(--net)}
  .route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
  .code{display:flex;flex-direction:column;gap:4px}
  .code button{all:unset;cursor:pointer;font:12px var(--mono);background:var(--card2);border-radius:6px;padding:4px 8px;word-break:break-all}
  .code button:hover{outline:1px solid var(--accent)}
  .code button.ok::after{content:"  copied";color:var(--accent)}
  .links{display:flex;flex-wrap:wrap;gap:6px}
  .links button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer;text-align:left}
  .links button:hover{border-color:var(--accent)}
  .links button small{color:var(--muted)}
  .nav{display:flex;gap:6px;margin-top:14px}
  .nav button{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:12.5px}
  .nav button:disabled{opacity:.4;cursor:default}
  .drill{margin-top:12px;width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}
  .hint{color:var(--muted);font-size:13px}
  .hint kbd{font:11.5px var(--mono);background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .legend{display:grid;grid-template-columns:64px 1fr;gap:8px 10px;align-items:center;font-size:12.5px}
  .legend svg{width:64px;height:30px;overflow:visible}
  .legend code{font:12px var(--mono);color:var(--fg)}
  footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 14px;border-top:1px solid var(--line);background:var(--card)}
  footer label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
  footer select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:300px}
  footer .btn{border-color:var(--line);color:var(--fg)}
  footer .btn.play{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
  #say{flex:1 1 320px;min-width:220px;font-size:13.5px;display:flex;gap:10px;align-items:baseline}
  #say .k{font:12px var(--mono);color:var(--muted);white-space:nowrap}
  @media (max-width:900px){
    body{overflow:auto;grid-template-rows:auto auto auto}
    main{grid-template-columns:1fr;grid-template-rows:66vh auto}
    aside{border-left:0;border-top:1px solid var(--line)}
  }

  /* ---- diagram ---- */
  .band{stroke:none}
  .band.browser{fill:color-mix(in srgb,var(--browser) 6%,transparent)}
  .band.server{fill:color-mix(in srgb,var(--server) 7%,transparent)}
  .band.net{fill:color-mix(in srgb,var(--net) 7%,transparent)}
  .band-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .band-label.browser{fill:var(--browser)} .band-label.server{fill:var(--server)} .band-label.net{fill:var(--net)}
  .heads-bg{fill:var(--bg);opacity:0;transition:opacity .15s}
  .stuck .heads-bg{opacity:.93}
  .life{stroke:var(--faint);stroke-width:1.1;stroke-dasharray:5 5}
  .p{cursor:pointer}
  .pbox{fill:var(--card);stroke:var(--stroke);stroke-width:1.3}
  .p:hover .pbox,.p.sel .pbox{stroke:var(--accent);stroke-width:2.2}
  .pname{fill:var(--fg);font-size:13.5px;font-weight:600}
  .psub{fill:var(--muted);font-size:10.5px}
  .picon{fill:none;stroke:var(--muted);stroke-width:1.3}
  .act{fill:var(--card2);stroke:var(--stroke);stroke-width:1.1}
  .m{cursor:pointer}
  .m-hit{fill:none;stroke:transparent;stroke-width:16}
  .m-line{fill:none;stroke:var(--fg);stroke-width:1.35}
  .m.ret .m-line{stroke-dasharray:6 4;stroke:var(--muted)}
  .m.net .m-line{stroke:var(--net)}
  .m.call .m-line,.m.self .m-line{marker-end:url(#mk-call)}
  .m.async .m-line{marker-end:url(#mk-async)}
  .m.ret .m-line{marker-end:url(#mk-open)}
  .m.net.call .m-line{marker-end:url(#mk-call-net)}
  .m.net.async .m-line,.m.net.ret .m-line{marker-end:url(#mk-open-net)}
  .m-label{font-size:12px;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
  .m.ret .m-label{fill:var(--muted)}
  .m.net .m-label{fill:var(--net)}
  .m:hover .m-line,.m.sel .m-line,.m.visited .m-line,.m.active .m-line{stroke:var(--accent)}
  .m:hover .m-label,.m.sel .m-label,.m.active .m-label{fill:var(--accent)}
  .m.sel .m-line,.m.active .m-line{stroke-width:2.6}
  .m:hover .m-line,.m.sel .m-line,.m.visited .m-line,.m.active .m-line{marker-end:url(#mk-hi)}
  .m.async:hover .m-line,.m.ret:hover .m-line,.m.async.sel .m-line,.m.ret.sel .m-line,.m.async.visited .m-line,.m.ret.visited .m-line,.m.async.active .m-line,.m.ret.active .m-line{marker-end:url(#mk-open-hi)}
  .m.active .m-line{filter:drop-shadow(0 0 5px var(--accent))}
  .fr{fill:none;stroke:var(--stroke);stroke-width:1.2;pointer-events:stroke}
  .fr-g{cursor:pointer}
  .fr-tag{fill:var(--card2);stroke:var(--stroke);stroke-width:1.2}
  .fr-op{font:700 12px var(--mono);fill:var(--fg)}
  .guard{font-size:12px;font-style:italic;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
  .sep{stroke:var(--stroke);stroke-width:1.1;stroke-dasharray:6 4}
  .fr-g:hover .fr,.fr-g:hover .fr-tag,.fr-g.sel .fr,.fr-g.sel .fr-tag,.fr-g.active .fr,.fr-g.active .fr-tag{stroke:var(--accent)}
  .fr-g.sel .fr,.fr-g.active .fr{stroke-width:2.2}
  .ref{cursor:pointer}
  .ref-box{fill:var(--card);stroke:var(--stroke);stroke-width:1.6}
  .ref-name{font-size:13.5px;font-weight:600;fill:var(--fg)}
  .ref-hint{font-size:11px;fill:var(--accent)}
  .ref:hover .ref-box,.ref.sel .ref-box,.ref.active .ref-box{stroke:var(--accent);stroke-width:2.4}
  .ref.visited .ref-box,.ref.active .ref-box{fill:var(--accent-soft)}
  .note-box{fill:var(--note);stroke:var(--stroke);stroke-width:1}
  .note-text{font-size:12px;fill:var(--fg)}
  .off{opacity:.22}
  .token{fill:var(--accent);stroke:var(--bg);stroke-width:2;filter:drop-shadow(0 0 6px var(--accent));pointer-events:none}
  .token.net{fill:var(--net);filter:drop-shadow(0 0 6px var(--net))}
  .mk-call{fill:var(--fg)} .mk-call-net{fill:var(--net)} .mk-hi{fill:var(--accent)}
  .mk-open{fill:none;stroke:var(--muted);stroke-width:1.4} .mk-async{fill:none;stroke:var(--fg);stroke-width:1.4} .mk-open-net{fill:none;stroke:var(--net);stroke-width:1.4} .mk-open-hi{fill:none;stroke:var(--accent);stroke-width:1.6}
</style>
</head>
<body>
<header>
  <h1>ReadAloud — how it works<small>UML sequence diagrams of the arc-reader app · click any arrow for details · <a href="readaloud-bpmn.html">BPMN process view</a></small></h1>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="tools">
    <button class="btn" id="legendBtn" title="Notation used here">Legend</button>
    <button class="btn" id="copyMmd" title="Copy this diagram as Mermaid sequenceDiagram text">Copy Mermaid</button>
    <button class="btn solid" id="dl" title="Download this diagram as a Mermaid .mmd file">Download .mmd</button>
    <button class="btn" id="theme" title="Toggle light / dark">◐</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="svg" aria-label="Sequence diagram" role="img">
      <defs>
        <marker id="mk-call" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-call" d="M0,1 L10,5 L0,9 z"/></marker>
        <marker id="mk-call-net" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-call-net" d="M0,1 L10,5 L0,9 z"/></marker>
        <marker id="mk-hi" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk-hi" d="M0,1 L10,5 L0,9 z"/></marker>
        <marker id="mk-open" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-open" d="M1,1 L9.5,5 L1,9"/></marker>
        <marker id="mk-async" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-async" d="M1,1 L9.5,5 L1,9"/></marker>
        <marker id="mk-open-net" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-open-net" d="M1,1 L9.5,5 L1,9"/></marker>
        <marker id="mk-open-hi" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk-open-hi" d="M1,1 L9.5,5 L1,9"/></marker>
      </defs>
      <g id="root"></g>
      <g id="heads"></g>
    </svg>
    <div class="crumb" id="crumb"></div>
    <div class="zoom">
      <button id="zin" title="Zoom in (+)">+</button>
      <button id="zout" title="Zoom out (−)">−</button>
      <button id="zfit" title="Fit width (0)">⤢</button>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<footer>
  <label>Walk through <select id="scen"></select></label>
  <button class="btn play" id="play">▶ Play</button>
  <button class="btn" id="back" title="Previous message (←)">‹ Back</button>
  <button class="btn" id="step" title="Next message (→)">Step ›</button>
  <button class="btn" id="reset">Reset</button>
  <label title="When a step references another diagram, open it and walk through it too"><input type="checkbox" id="follow" checked> follow into referenced diagrams</label>
  <div id="say"><span class="k" id="sayk"></span><span id="sayt" class="hint">Pick a walkthrough and press Play, or click any arrow.</span></div>
</footer>

<!-- Model, layout and Mermaid export: no DOM access, so it can be checked outside a browser. -->
<script id="core">
const SRC = "apps/web/src/";

/* Participants, left to right. */
const P = {
  U: { n: "Listener", kind: "actor", d: "The person using the app: pastes, shares, presses play, picks voices." },
  UI: { n: "Screens", s: "Compose · ReadNew · Reader", d: "React Router routes: Compose (/), ReadNew (/read/new, the Web Share Target) and Reader (/read/:id). Library and Settings are left out here.", code: [SRC + "App.tsx:48", SRC + "routes/Compose.tsx:119", SRC + "routes/ReadNew.tsx:15"] },
  PL: { n: "usePlayer", s: "state/player.ts", d: "The Zustand player store. It owns the single PlaybackEngine, resolves the voice, rewrites Patois, restores the saved place, and turns engine callbacks into UI state (speechError, offline, toasts).", code: [SRC + "state/player.ts:86", SRC + "state/player.ts:140"] },
  EN: { n: "PlaybackEngine", s: "engine/engine.ts", d: "Plain TypeScript, no React. Owns the loaded document, the passage plan, one <audio> element per passage, the requestAnimationFrame clock, prefetch, and saving the position.", code: [SRC + "engine/engine.ts:101"] },
  PR: { n: "synthesize()", s: "providers.ts · preparation.ts", d: "The provider chain — cache → older sentence clips → server-prepared clip → speech API → browser voice — and the background-preparation client.", code: [SRC + "engine/providers.ts:410", SRC + "engine/preparation.ts:172"] },
  DB: { n: "IndexedDB", s: "docs · positions · audio", kind: "db", d: "The readaloud database (idb). docs: Library documents. positions: one per document. audio: clips keyed by engine + voice + text, up to 2000, oldest evicted first.", code: [SRC + "lib/db.ts:143", SRC + "lib/db.ts:233"] },
  SV: { n: "App server", s: "Vite plugins · /api/*", d: "Node-side plugins of the Vite dev and preview servers (the Docker image runs preview on :4179). /api/fetch fetches pages; /api/vs, /api/oa and /api/fish proxy speech APIs with keys from server-side env, so keys never reach the bundle; /api/preparations is the background job service.", code: ["apps/web/vite.config.ts:16", "apps/web/vite.fetch.ts:28", "apps/web/vite.proxy.ts:42", "apps/web/vite.prepare.ts:424"] },
  DK: { n: "Disk", s: "preparations · library.json", kind: "db", d: "Server-side files on volumes. Preparations: PREPARATION_DATA_DIR (default .readaloud-preparations) — job JSON written atomically, clips as <key>.bin + <key>.json (shared-<key> for clips uploaded by devices), restored after a restart and deleted after 7 days. Library: LIBRARY_DATA_DIR/library.json.", code: ["apps/web/vite.prepare.ts:49", "apps/web/vite.library.ts:173", "compose.yaml:57", "compose.yaml:59"] },
  VS: { n: "VoiceStudio", s: "Mac mini · container overflow", d: "Self-hosted TTS with an OpenAI-compatible API (/v1/audio/speech, /v1/audio/transcriptions). One worker that queues at most one more request; a third concurrent request gets 429. KittenTTS is fast on CPU; OmniVoice clones and designed voices are ~10× slower than real time on CPU, so the Mac (GPU) is preferred.", code: ["compose.yaml:41"] },
  VM: { n: "VoiceStudio · primary", s: "Mac mini (GPU)", d: "VOICESTUDIO_URL. Takes every new reading whenever it is free.", code: ["compose.yaml:44"] },
  VC: { n: "VoiceStudio · overflow", s: "local container", d: "VOICESTUDIO_SECONDARY_URL (named “Omarchy” by default). Used only while the primary is busy, and only for voices it can reproduce exactly.", code: ["compose.yaml:49", "apps/web/vite.preparation-workers.ts:81"] },
  EX: { n: "Web & cloud", s: "web pages · OpenAI · Fish · LLM", d: "Any web page the listener asked for (X posts through FxTwitter); OpenAI (the Patois rewrite and OpenAI voices) through /api/oa; Fish Audio through /api/fish; the LLM (OpenCode Go) that explains code, describes images and writes summaries, through /api/llm.", code: ["apps/web/vite.xpost.ts:11", "apps/web/vite.llm.ts:98"] },
  LS: { n: "librarySync", s: "lib/librarySync.ts", d: "Sends the outbox to the app server and applies the shared library it answers with. One run at a time, triggered by changes, a 5 s timer, coming online and focus.", code: [SRC + "lib/librarySync.ts:82", SRC + "lib/librarySync.ts:133"] },
  SM: { n: "useSummaries", s: "state/summaries.ts · lib/summary.ts", d: "Requests article summaries from the LLM and stores them on the document.", code: [SRC + "state/summaries.ts:20", SRC + "lib/summary.ts:30"] },
};
const ORDER = ["U", "UI", "SM", "PL", "EN", "PR", "LS", "DB", "SV", "DK", "VS", "VM", "VC", "EX"];
const GROUPS = [
  { id: "browser", n: "Browser · PWA", ps: ["UI", "SM", "PL", "EN", "PR", "LS", "DB"] },
  { id: "server", n: "App server", ps: ["SV", "DK"] },
  { id: "net", n: "Speech & the web", ps: ["VS", "VM", "VC", "EX"] },
];
const groupOf = (p) => GROUPS.find((g) => g.ps.includes(p))?.id || "";
/** An arrow that leaves the browser, or leaves the app server for an upstream service. */
const isNet = (m) => m.f !== m.to && groupOf(m.f) !== groupOf(m.to) && m.f !== "U" && m.to !== "U";

const OPS = {
  alt: "Alternatives: exactly one operand runs — the first whose [guard] holds.",
  opt: "Optional: the operand runs only when its [guard] holds.",
  loop: "Loop: the operand repeats while its [guard] holds.",
  par: "Parallel: the operands run at the same time.",
  break: "Break: when its [guard] holds, the operand runs and the rest of the enclosing fragment is skipped.",
};

const SEQS = {
  /* ------------------------------------------------------------------ 1 */
  play: {
    title: "Open and play",
    sub: "From pasted text or a shared link to a voice reading it, passage by passage, with the highlight following and the place saved.",
    overview: [
      "Everything the listener sees runs in the browser. The app server (Vite plugins, also in the Docker image) fetches web pages, proxies speech APIs with the keys kept server-side, and runs background preparation jobs.",
      "Text is planned into passages (≤ ~60 words, never across a paragraph). Each passage is one speech request and one clip; the highlight still moves sentence by sentence inside the clip.",
      "Two boxes are references (ref) to the other diagrams: how one passage gets audio, and how a whole reading is prepared ahead of time.",
      "Code blocks and images are read as narration: an LLM explains code before the reading opens, and describes images in the background while it plays.",
      "Not drawn: the listener can pause, seek, skip, change speed or voice at any time. pause() discards a passage still being generated; a voice change clears prepared chunks.",
    ],
    rows: [
      { f: "U", to: "UI", t: "async", n: "paste text · press Listen", say: "The listener pastes an article on Compose and presses Listen.",
        d: "Compose (the home route) takes pasted text, the clipboard, an uploaded .txt/.md file, the sample, or a web address. A share from another app opens /read/new?title=&text=&url= instead — the installed PWA is a Web Share Target.",
        code: [SRC + "routes/Compose.tsx:119", SRC + "routes/Compose.tsx:76", SRC + "routes/ReadNew.tsx:15", "apps/web/vite.config.ts:52"] },
      { op: "opt", id: "url", g: "a web address was entered or shared", rows: [

/** Normalize once: single-operand fragments get `ops`, messages and notes get ids, everything knows its parent. */
function prep() {
  for (const [key, D] of Object.entries(SEQS)) {
    let n = 0;
    const walk = (rows, ctx) => {
      for (const it of rows) {
        it.ctx = ctx;
        it.diag = key;
        if (it.op) {
          if (!it.ops) it.ops = [{ g: it.g, say: it.say, rows: it.rows }];
          it.ops.forEach((op, k) => walk(op.rows, [...ctx, { frag: it, k }]));
        } else if (it.f) it.id = "m" + ++n;
      }
    };
    walk(D.rows, []);
  }
}
prep();

function eachRow(rows, fn) {
  for (const it of rows) {
    fn(it);
    if (it.ops) for (const op of it.ops) eachRow(op.rows, fn);
  }
}
function find(diag, id) {
  let hit = null;
  eachRow(SEQS[diag].rows, (it) => { if (it.id === id) hit = it; });
  return hit;
}
function messages(diag) {
  const out = [];
  eachRow(SEQS[diag].rows, (it) => { if (it.f) out.push(it); });
  return out;
}

/** Rough text width; layout has to run without a DOM. */
const tw = (s, px = 12) => (s || "").length * px * 0.56;

/* ---- layout ---- */

const C = { BOX_Y: 30, BOX_H: 48, TOP: 112, MSG: 38, SELF: 52, FHEAD: 32, OPHEAD: 28, FEND: 12, REF: 58, ACT_W: 10, ACT_STEP: 5, MIN_GAP: 150 };
const HEAD_H = C.BOX_Y + C.BOX_H + 10;
const boxW = (p) => Math.max(120, tw(p.n, 13.5) + (p.kind ? 52 : 30), tw(p.s, 10.5) + 26);
const tagW = (op) => op.length * 7.6 + 22;

const cache = {};
function layout(id) {
  if (cache[id]) return cache[id];
  const D = SEQS[id];
  const used = new Set();
  eachRow(D.rows, (it) => { for (const p of [it.f, it.to, ...(it.over || [])]) if (p) used.add(p); });
  const ps = ORDER.filter((p) => used.has(p)).map((p) => ({ id: p, ...P[p], w: boxW(P[p]) }));
  const ix = Object.fromEntries(ps.map((p, i) => [p.id, i]));

  // Horizontal spacing: wide enough for the boxes, then for every arrow label (narrow spans first).
  const gap = ps.slice(1).map((p, i) => Math.max(C.MIN_GAP, (ps[i].w + p.w) / 2 + 26) + (groupOf(ps[i].id) !== groupOf(p.id) ? 24 : 0));
  const msgs = messages(id);
  const span = (m) => Math.abs(ix[m.f] - ix[m.to]);
  for (const m of [...msgs].sort((a, b) => span(a) - span(b))) {
    const a = ix[m.f], b = ix[m.to];
    if (a === b) {
      if (a < gap.length) gap[a] = Math.max(gap[a], tw(m.n) + 70);
      continue;
    }
    const lo = Math.min(a, b), hi = Math.max(a, b);
    let have = 0;
    for (let i = lo; i < hi; i++) have += gap[i];
    const need = tw(m.n) + 44;
    if (have < need) for (let i = lo; i < hi; i++) gap[i] += (need - have) / (hi - lo);
  }
  const X = {};
  ps.forEach((p, i) => { p.x = i ? ps[i - 1].x + gap[i - 1] : 0; X[p.id] = p.x; });

  // Vertical pass, with activation bars kept as stacks of open segments per participant.
  const st = {}, acts = [], items = [];
  let y = C.TOP;
  const stack = (p) => st[p] || (st[p] = []);
  const openAct = (p, y0) => { const s = stack(p); const a = { p, y0, y1: null, d: s.length }; s.push(a); acts.push(a); return a; };
  const closeAct = (p, y1) => { const a = stack(p).pop(); if (a) a.y1 = y1; return a; };
  const edge = (p, dir) => { const n = stack(p).length; return n ? X[p] + (n - 1) * C.ACT_STEP + dir * C.ACT_W / 2 : X[p]; };

  function rows(list) {
    for (const it of list) {
      if (it.ops) frag(it);
      else if (it.f) message(it);
      else if (it.ref) ref(it);
    }
  }
  function message(m) {
    items.push(m);
    if (m.f === m.to) {
      const ya = y + 24, x1 = edge(m.f, 1);
      const a = openAct(m.f, ya + 10);
      const x2 = edge(m.f, 1);
      stack(m.f).pop();
      a.y1 = ya + 30;
      Object.assign(m, { y: ya, y2: ya + 18, x1, x2, xr: x1 + 32, lx: x1 + 8, ly: ya - 7, anchor: "start" });
      y += C.SELF;
      return;
    }
    const ya = y + 26, dir = Math.sign(X[m.to] - X[m.f]);
    const x1 = edge(m.f, dir);
    if (m.t === "ret") closeAct(m.f, ya);
    if (m.t === "call") openAct(m.to, ya);
    const x2 = edge(m.to, -dir);
    Object.assign(m, { y: ya, x1, x2, lx: (x1 + x2) / 2, ly: ya - 7, anchor: "middle" });
    y += C.MSG;
  }
  function ref(r) {
    items.push(r);
    const xs = r.over.map((p) => X[p]);
    Object.assign(r, { x0: Math.min(...xs) - 50, x1: Math.max(...xs) + 50, y0: y + 10, y1: y + 10 + 40 });
    y += C.REF;
  }
  function frag(F) {
    // Every pre-existing open segment, by stack position, and its current segment object.
    const keys = [], cur = new Map();
    for (const p in st) st[p].forEach((a, i) => { keys.push([p, i]); cur.set(p + ":" + i, a); });
    const isCur = (a) => [...cur.values()].includes(a);
    const closedIn = [];
    const restore = (at) => {
      for (const p in st) st[p] = [];
      for (const [p, i] of keys) {
        const key = p + ":" + i;
        let a = cur.get(key);
        if (a.y1 !== null) { a = { p, y0: at, y1: null, d: i }; acts.push(a); cur.set(key, a); }
        stack(p)[i] = a;
      }
    };
    items.push(F);
    F.y0 = y + 6;
    y += C.FHEAD;
    F.ops.forEach((op, k) => {
      if (k) { restore(y); op.sep = y; y += C.OPHEAD; }
      op.y0 = k ? op.sep : F.y0;
      rows(op.rows);
      // Close whatever this operand opened and left open.
      for (const p in st) while (st[p].length && !isCur(st[p][st[p].length - 1])) closeAct(p, y + 4);
      closedIn.push(new Set(keys.map(([p, i]) => p + ":" + i).filter((key) => cur.get(key).y1 !== null)));
      op.y1 = y + 6;
    });
    y += C.FEND;
    F.y1 = y;
    y += 12;
    // After the fragment: alt closes what every operand closed; par what any did; opt/loop/break nothing.
    const closed = F.op === "alt" ? new Set([...closedIn[0]].filter((key) => closedIn.every((s) => s.has(key))))
      : F.op === "par" ? new Set(closedIn.flatMap((s) => [...s])) : new Set();
    for (const p in st) st[p] = [];
    for (const [p, i] of keys) {
      const key = p + ":" + i;
      if (closed.has(key)) continue;
      let a = cur.get(key);
      if (a.y1 !== null) { a = { p, y0: F.y1, y1: null, d: stack(p).length }; acts.push(a); }
      stack(p).push(a);
    }
  }
  rows(D.rows);
  y += 26;
  for (const p in st) while (st[p].length) closeAct(p, y);
  const height = y + 24;

  // Fragment frames, from the inside out.
  function bounds(list) {
    let lo = Infinity, hi = -Infinity;
    const add = (a, b) => { lo = Math.min(lo, a); hi = Math.max(hi, b); };
    for (const it of list) {
      if (it.ops) {
        const [a, b] = bounds(it.ops.flatMap((op) => op.rows));
        it.x0 = a - 18;
        it.x1 = Math.max(b + 18, it.x0 + tagW(it.op) + tw("[" + it.ops[0].g + "]") + 26, ...it.ops.slice(1).map((op) => it.x0 + tw("[" + op.g + "]") + 28));
        add(it.x0, it.x1);
      } else if (it.f && it.f === it.to) add(it.x1 - 8, Math.max(it.xr + 8, it.lx + tw(it.n) + 6));
      else if (it.f) add(Math.min(it.x1, it.x2, it.lx - tw(it.n) / 2), Math.max(it.x1, it.x2, it.lx + tw(it.n) / 2));
      else if (it.ref) add(it.x0, it.x1);
    }
    return [lo, hi];
  }
  const [blo, bhi] = bounds(D.rows);
  const bands = GROUPS.map((g) => {
    const mine = ps.filter((p) => g.ps.includes(p.id));
    if (!mine.length) return null;
    return { id: g.id, n: g.n, x0: Math.min(...mine.map((p) => p.x - p.w / 2)) - 12, x1: Math.max(...mine.map((p) => p.x + p.w / 2)) + 12 };
  }).filter(Boolean);
  const x0 = Math.min(blo, ...ps.map((p) => p.x - p.w / 2), ...bands.map((b) => b.x0)) - 24;
  const x1 = Math.max(bhi, ...ps.map((p) => p.x + p.w / 2), ...bands.map((b) => b.x1)) + 24;
  return (cache[id] = { id, ps, X, items, acts, bands, x0, x1, height });
}

/* ---- walkthroughs ---- */

/**
 * The ordered steps of a scenario. alt runs its picked operand (default the first),
 * opt and break run only when picked, loops run once, par runs every operand.
 * A break that runs ends its enclosing fragment.
 */
function buildSteps(diag, scId, follow, crumb = []) {
  const D = SEQS[diag];
  const sc = D.scenarios.find((s) => s.id === scId) || { pick: {}, calls: {} };
  const out = [];
  const step = (it, extra) => out.push({ diag, id: it.id, crumb: [...crumb, diag], ...extra });
  function rows(list) {
    for (const it of list) {
      if (it.ops) { if (frag(it)) return true; }
      else if (it.f) step(it, { say: it.say });
      else if (it.ref) {
        step(it, { say: it.say, ref: true });
        const target = sc.calls?.[it.id];
        if (follow && target !== null) out.push(...buildSteps(it.ref, target || SEQS[it.ref].scenarios[0].id, follow, [...crumb, diag]));
      }
    }
    return false;
  }
  function operand(F, k) {
    if (F.ops[k].say) step(F, { say: F.ops[k].say, op: k });
    rows(F.ops[k].rows);
  }
  function frag(F) {
    const pick = sc.pick?.[F.id];
    if (F.op === "par") { F.ops.forEach((_, k) => operand(F, k)); return false; }
    if (F.op === "alt") { operand(F, pick ?? 0); return false; }
    if (F.op === "loop") { operand(F, 0); return false; }
    if (pick === undefined || pick < 0) return false;
    operand(F, 0);
    return F.op === "break";
  }
  rows(D.rows);
  return out;
}

/* ---- Mermaid export ---- */

function toMermaid(id) {
  const D = SEQS[id], L = layout(id);
  const clean = (s) => String(s || "").replace(/</g, "‹").replace(/>/g, "›").replace(/[;#]/g, ",").replace(/\s+/g, " ").trim();
  const out = ["%% ReadAloud — " + D.title + " (generated from docs/readaloud-sequence.html)", "sequenceDiagram"];
  const decl = (p, ind) => `${ind}${p.kind === "actor" ? "actor" : "participant"} ${p.id} as ${clean(p.n)}`;
  for (const p of L.ps) {
    const g = GROUPS.find((x) => x.ps.includes(p.id));
    if (!g) out.push(decl(p, "  "));
  }
  for (const g of GROUPS) {
    const mine = L.ps.filter((p) => g.ps.includes(p.id));
    if (!mine.length) continue;
    out.push(`  box ${clean(g.n)}`);
    for (const p of mine) out.push(decl(p, "    "));
    out.push("  end");
  }
  const arrow = { call: "->>", self: "->>", async: "-)", ret: "-->>" };
  const word = { alt: ["alt", "else"], opt: ["opt"], loop: ["loop"], par: ["par", "and"], break: ["break"] };
  function rows(list, ind) {
    for (const it of list) {
      if (it.ops) {
        it.ops.forEach((op, k) => {
          const w = k ? word[it.op][1] : word[it.op][0];
          const g = clean(k ? op.g.replace(/^else:?\s*/, "") : op.g);
          out.push(`${ind}${w}${g ? " " + g : ""}`);
          rows(op.rows, ind + "  ");
        });
        out.push(`${ind}end`);
      } else if (it.f) out.push(`${ind}${it.f}${arrow[it.t]}${it.to}: ${clean(it.n)}`);
      else if (it.ref) out.push(`${ind}Note over ${it.over[0]},${it.over[it.over.length - 1]}: ref · ${clean(it.n)} (see that diagram)`);
    }
  }
  rows(D.rows, "  ");
  return out.join("\n") + "\n";
}

if (typeof module !== "undefined") module.exports = { P, ORDER, GROUPS, SEQS, OPS, layout, buildSteps, toMermaid, find, messages, isNet, C, HEAD_H };
</script>

<script id="ui">
(() => {
  const $ = (s) => document.querySelector(s);
  const svg = $("#svg"), root = $("#root"), heads = $("#heads"), panel = $("#panel");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const KEYS = Object.keys(SEQS);
  const S = { cur: KEYS[0], k: 1, tx: 0, ty: 0, sel: null, walk: null, legend: false };

  /* ---------- theme ---------- */
  const THEME_KEY = "readaloud-bpmn-theme";
  const setTheme = (t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME_KEY, t); } catch {} };
  try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.dataset.theme = t; } catch {}
  $("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

  /* ---------- tabs ---------- */
  function renderTabs() {
    $("#tabs").innerHTML = KEYS.map((k, i) => `<button role="tab" data-tab="${k}" aria-selected="${k === S.cur}"><span class="n">${i + 1}</span>${esc(SEQS[k].title)}</button>`).join("");
  }
  $("#tabs").onclick = (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    stopWalk(true);
    open(b.dataset.tab);
  };

  /* ---------- drawing ---------- */
  function icon(p, x, y) {
    if (p.kind === "actor") return `<g class="picon" transform="translate(${x},${y})"><circle cx="0" cy="-6" r="4"/><path d="M0,-2 V7 M-6,1 H6 M0,7 L-5,14 M0,7 L5,14"/></g>`;
    if (p.kind === "db") return `<g class="picon" transform="translate(${x},${y})"><ellipse cx="0" cy="-5" rx="7" ry="3"/><path d="M-7,-5 V8 A7,3 0 0 0 7,8 V-5"/></g>`;
    return "";
  }
  function drawHeads(L) {
    const bg = `<rect class="heads-bg" x="${L.x0 - 4000}" y="-4000" width="${L.x1 - L.x0 + 8000}" height="${4000 + HEAD_H}"/>`;
    const bands = L.bands.map((b) => `<rect class="band ${b.id}" x="${b.x0}" y="0" width="${b.x1 - b.x0}" height="${HEAD_H}"/><text class="band-label ${b.id}" x="${b.x0 + 10}" y="18">${esc(b.n)}</text>`).join("");
    const boxes = L.ps.map((p) => {
      const hasIcon = !!p.kind;
      const tx = hasIcon ? p.x + 11 : p.x;
      return `<g class="p" data-k="p" data-id="${p.id}">
        <rect class="pbox" x="${p.x - p.w / 2}" y="${C.BOX_Y}" width="${p.w}" height="${C.BOX_H}" rx="9"/>
        ${hasIcon ? icon(p, p.x - tw(p.n, 13.5) / 2 - 8, C.BOX_Y + (p.s ? 20 : 26)) : ""}
        <text class="pname" x="${tx}" y="${C.BOX_Y + (p.s ? 21 : 29)}" text-anchor="middle">${esc(p.n)}</text>
        ${p.s ? `<text class="psub" x="${p.x}" y="${C.BOX_Y + 38}" text-anchor="middle">${esc(p.s)}</text>` : ""}
      </g>`;
    }).join("");
    heads.innerHTML = bg + bands + boxes;
  }
  function drawBody(L) {
    const h = L.height;
    let s = L.bands.map((b) => `<rect class="band ${b.id}" x="${b.x0}" y="${HEAD_H}" width="${b.x1 - b.x0}" height="${h - HEAD_H}"/>`).join("");
    s += L.ps.map((p) => `<line class="life" x1="${p.x}" y1="${C.BOX_Y + C.BOX_H}" x2="${p.x}" y2="${h - 10}"/>`).join("");
    // Frames first (outermost first), then activations, then arrows on top.
    const frames = L.items.filter((it) => it.ops).sort((a, b) => a.ctx.length - b.ctx.length);
    // Each frame is one group: its outline sits under the activation bars, its tag and guards above them.
    for (const F of frames) {
      const tw0 = tagW(F.op);
      s += `<g class="fr-g" data-k="f" data-id="${F.id}">
        <rect class="fr" x="${F.x0}" y="${F.y0}" width="${F.x1 - F.x0}" height="${F.y1 - F.y0}" rx="4"/>
        ${F.ops.slice(1).map((op) => `<line class="sep" x1="${F.x0}" y1="${op.sep}" x2="${F.x1}" y2="${op.sep}"/>`).join("")}
      </g>`;
    }
    s += L.acts.map((a) => `<rect class="act" x="${L.X[a.p] + a.d * C.ACT_STEP - C.ACT_W / 2}" y="${a.y0}" width="${C.ACT_W}" height="${Math.max(6, a.y1 - a.y0)}"/>`).join("");
    for (const F of frames) {
      const tw0 = tagW(F.op);
      s += `<g class="fr-g" data-k="f" data-id="${F.id}">
        <path class="fr-tag" d="M${F.x0},${F.y0} h${tw0} v13 l-8,9 H${F.x0} z"/>
        <text class="fr-op" x="${F.x0 + 8}" y="${F.y0 + 16}">${F.op}</text>
        <text class="guard" x="${F.x0 + tw0 + 10}" y="${F.y0 + 17}">[${esc(F.ops[0].g)}]</text>
        ${F.ops.slice(1).map((op) => `<text class="guard" x="${F.x0 + 10}" y="${op.sep + 18}">[${esc(op.g)}]</text>`).join("")}
      </g>`;
    }
    for (const it of L.items) {
      if (it.ref) {
        s += `<g class="ref" data-k="r" data-id="${it.id}">
          <rect class="ref-box" x="${it.x0}" y="${it.y0}" width="${it.x1 - it.x0}" height="${it.y1 - it.y0}" rx="4"/>
          <path class="fr-tag" d="M${it.x0},${it.y0} h40 v12 l-8,8 H${it.x0} z"/>
          <text class="fr-op" x="${it.x0 + 8}" y="${it.y0 + 15}">ref</text>
          <text class="ref-name" x="${(it.x0 + it.x1) / 2}" y="${it.y0 + 20}" text-anchor="middle">${esc(it.n)}</text>
          <text class="ref-hint" x="${(it.x0 + it.x1) / 2}" y="${it.y0 + 34}" text-anchor="middle">double-click to open ›</text>
        </g>`;
      } else if (it.f) {
        const cls = ["m", it.f === it.to ? "self" : it.t, isNet(it) ? "net" : ""].join(" ");
        s += `<g class="${cls}" data-k="m" data-id="${it.id}"><path class="m-hit" d="${pathOf(it)}"/><path class="m-line" d="${pathOf(it)}"/>
          <text class="m-label" x="${it.lx}" y="${it.ly}" text-anchor="${it.anchor}">${esc(it.n)}</text></g>`;
      }
    }
    root.innerHTML = s;
  }
  const pathOf = (m) => m.f === m.to
    ? `M${m.x1},${m.y} H${m.xr} V${m.y2} H${m.x2 + 1}`
    : `M${m.x1},${m.y} H${m.x2}`;
  const pointsOf = (m) => m.f === m.to ? [[m.x1, m.y], [m.xr, m.y], [m.xr, m.y2], [m.x2, m.y2]] : [[m.x1, m.y], [m.x2, m.y]];

  function render() {
    const L = layout(S.cur);
    drawBody(L);
    drawHeads(L);
    renderTabs();
    $("#scen").innerHTML = SEQS[S.cur].scenarios.map((s) => `<option value="${s.id}">${esc(s.n)}</option>`).join("");
    applyWalkClasses();
    markSel();
    apply();
  }

  /* ---------- pan & zoom ---------- */
  const stage = $("#stage");
  function clampPan() {
    // Keep at least some of the diagram on screen.
    const L = layout(S.cur), W = stage.clientWidth, H = stage.clientHeight;
    S.tx = Math.max(120 - L.x1 * S.k, Math.min(W - 120 - L.x0 * S.k, S.tx));
    S.ty = Math.max(Math.min(12, H - L.height * S.k - 40), Math.min(40, S.ty));
  }
  function apply() {
    clampPan();
    root.setAttribute("transform", `translate(${S.tx},${S.ty}) scale(${S.k})`);
    heads.setAttribute("transform", `translate(${S.tx},${Math.max(S.ty, 0)}) scale(${S.k})`);
    heads.classList.toggle("stuck", S.ty < 0);
  }
  function fit() {
    const L = layout(S.cur), W = stage.clientWidth;
    S.k = Math.max(0.35, Math.min(1.1, (W - 40) / (L.x1 - L.x0)));
    S.tx = (W - (L.x1 - L.x0) * S.k) / 2 - L.x0 * S.k;
    S.ty = 12;
    apply();
  }
  function zoomAt(f, cx, cy) {
    const k = Math.max(0.25, Math.min(2.5, S.k * f));
    S.tx = cx - (cx - S.tx) * (k / S.k);
    S.ty = cy - (cy - S.ty) * (k / S.k);
    S.k = k;
    apply();
  }
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const r = svg.getBoundingClientRect();
      zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
    } else {
      S.tx -= e.shiftKey ? e.deltaY : e.deltaX;
      S.ty -= e.shiftKey ? 0 : e.deltaY;
      apply();
    }
  }, { passive: false });
  $("#zin").onclick = () => zoomAt(1.2, stage.clientWidth / 2, stage.clientHeight / 2);
  $("#zout").onclick = () => zoomAt(1 / 1.2, stage.clientWidth / 2, stage.clientHeight / 2);
  $("#zfit").onclick = fit;
  let drag = null;
  svg.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty, moved: false };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    svg.classList.add("drag");
    S.tx = drag.tx + dx;
    S.ty = drag.ty + dy;
    apply();
  });
  svg.addEventListener("pointerup", (e) => {
    const d = drag;
    drag = null;
    svg.classList.remove("drag");
    if (d && !d.moved) {
      const t = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-k]");
      if (t) select(t.dataset.k, t.dataset.id);
      else { S.sel = null; markSel(); showHome(); }
    }
  });
  svg.addEventListener("dblclick", (e) => {
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-k="r"]');
    if (t) { stopWalk(true); open(find(S.cur, t.dataset.id).ref); }
  });
  /** Bring a y range (content coordinates) into view below the sticky participant header. */
  function reveal(y0, y1, x0, x1) {
    const H = stage.clientHeight, W = stage.clientWidth;
    const top = (Math.max(S.ty, 0) + HEAD_H * S.k + 10 - S.ty) / S.k, bottom = (H - 50 - S.ty) / S.k;
    const to = { tx: S.tx, ty: S.ty };
    if (y0 < top || y1 > bottom) to.ty = Math.min(12, H * 0.45 - ((y0 + y1) / 2) * S.k);
    if (x0 !== undefined && (x0 * S.k + S.tx < 10 || x1 * S.k + S.tx > W - 60)) to.tx = W / 2 - ((x0 + x1) / 2) * S.k;
    if (to.tx === S.tx && to.ty === S.ty) return;
    const from = { tx: S.tx, ty: S.ty }, t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / 320), e = 1 - (1 - p) ** 3;
      S.tx = from.tx + (to.tx - from.tx) * e;
      S.ty = from.ty + (to.ty - from.ty) * e;
      apply();
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  /* ---------- selection & panel ---------- */
  function open(id, keepPanel) {
    S.cur = id;
    S.sel = null;
    history.replaceState(null, "", "#" + id);
    render();
    fit();
    if (!keepPanel) showHome();
  }
  function markSel() {
    root.querySelectorAll(".sel").forEach((n) => n.classList.remove("sel"));
    heads.querySelectorAll(".sel").forEach((n) => n.classList.remove("sel"));
    if (!S.sel) return;
    const host = S.sel.k === "p" ? heads : root;
    host.querySelectorAll(`[data-k="${S.sel.k}"][data-id="${S.sel.id}"]`).forEach((n) => n.classList.add("sel"));
  }
  function select(k, id, scroll) {
    S.sel = { k, id };
    S.legend = false;
    markSel();
    if (k === "p") showPart(id);
    else if (k === "m") showMsg(find(S.cur, id), scroll);
    else if (k === "f") showFrag(find(S.cur, id));
    else if (k === "r") showRef(find(S.cur, id));
  }
  const codeList = (code) => code?.length ? `<h3>In the code</h3><div class="code">${code.map((c) => `<button data-copy="${esc(c)}" title="Copy path">${esc(c)}</button>`).join("")}</div>` : "";
  const pLink = (id) => `<button data-sel="p:${id}">${esc(P[id].n)}${P[id].s ? ` <small>${esc(P[id].s)}</small>` : ""}</button>`;
  const ctxText = (it) => (it.ctx || []).map(({ frag, k }) => `<button data-sel="f:${frag.id}"><b>${frag.op}</b> <small>[${esc(frag.ops[k].g)}]</small></button>`).join("");
  const KIND = { call: "Synchronous call — waits for the answer", async: "Asynchronous message — doesn’t wait", ret: "Return", self: "Self call" };

  function showHome() {
    const D = SEQS[S.cur];
    panel.innerHTML = `<span class="kind"><i></i>Sequence diagram</span>
      <h2>${esc(D.title)}</h2>
      <p>${esc(D.sub)}</p>
      ${D.overview.map((p) => `<p class="hint">${esc(p)}</p>`).join("")}
      ${D.parent ? `<div class="links"><button data-open="${D.parent}">‹ back to ${esc(SEQS[D.parent].title)}</button></div>` : ""}
      <h3>Walkthroughs</h3>
      <div class="links">${D.scenarios.map((s) => `<button data-scen="${s.id}">▶ ${esc(s.n)}</button>`).join("")}</div>
      <h3>Participants</h3>
      <div class="links">${layout(S.cur).ps.map((p) => pLink(p.id)).join("")}</div>
      <h3>Reading it</h3>
      <p class="hint">Time runs downward. Each column is a participant; arrows are calls between them, and the bars show who is busy. Blue arrows cross the network. Boxed regions are fragments: alternatives, options, loops and parallel work.</p>
      <p class="hint">Click an arrow, box or participant for details and code paths. <kbd>→</kbd> <kbd>←</kbd> step, <kbd>Space</kbd> play/pause, <kbd>Esc</kbd> stop, scroll to move, <kbd>Ctrl</kbd>+scroll or <kbd>+</kbd> <kbd>−</kbd> to zoom, <kbd>0</kbd> to fit.</p>`;
  }
  function showPart(id) {
    const p = P[id], ms = messages(S.cur);
    const sent = ms.filter((m) => m.f === id && m.to !== id).length, got = ms.filter((m) => m.to === id && m.f !== id).length;
    panel.innerHTML = `<span class="kind"><i></i>Participant${p.kind === "actor" ? " · person" : p.kind === "db" ? " · storage" : ""}</span>
      <h2>${esc(p.n)}</h2>
      ${p.s ? `<p class="hint">${esc(p.s)}</p>` : ""}
      <p>${esc(p.d || "")}</p>
      <p class="hint">In this diagram it sends ${sent} and receives ${got} message${got === 1 ? "" : "s"}.</p>
      ${codeList(p.code)}`;
  }
  function showMsg(m, scroll) {
    const ms = messages(S.cur), i = ms.indexOf(m);
    const net = isNet(m);
    panel.innerHTML = `<span class="kind${net ? " net" : ""}"><i></i>${m.f === m.to ? KIND.self : KIND[m.t]}${net ? " · over the network" : ""}</span>
      <h2><code>${esc(m.n)}</code></h2>
      <div class="route links">${pLink(m.f)}${m.f !== m.to ? `<span class="hint">→</span>${pLink(m.to)}` : ""}</div>
      ${m.say ? `<p style="margin-top:12px">${esc(m.say)}</p>` : ""}
      ${m.d ? `<p class="hint">${esc(m.d)}</p>` : ""}
      ${m.facts?.length ? `<h3>Numbers</h3><ul>${m.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${codeList(m.code)}
      ${m.ctx?.length ? `<h3>Inside</h3><div class="links">${ctxText(m)}</div>` : ""}
      <div class="nav"><button data-sel="${i > 0 ? "m:" + ms[i - 1].id : ""}" ${i > 0 ? "" : "disabled"}>‹ previous</button><button data-sel="${i < ms.length - 1 ? "m:" + ms[i + 1].id : ""}" ${i < ms.length - 1 ? "" : "disabled"}>next ›</button></div>`;
    if (scroll) reveal(m.y - 30, (m.y2 || m.y) + 10, Math.min(m.x1, m.x2, m.xr ?? m.x1), Math.max(m.x1, m.x2, m.xr ?? m.x1));
  }
  function showFrag(F) {
    const n = (op) => { let c = 0; eachRowUI(op.rows, (it) => { if (it.f) c++; }); return c; };
    panel.innerHTML = `<span class="kind"><i></i>Combined fragment · ${F.op}</span>
      <h2>${esc(F.op)} <span class="hint" style="font:14px var(--sans)">${F.ops.length > 1 ? F.ops.length + " operands" : ""}</span></h2>
      <p>${esc(OPS[F.op])}</p>
      <h3>${F.ops.length > 1 ? "Operands" : "Guard"}</h3>
      <ul>${F.ops.map((op) => `<li>[${esc(op.g)}] <span class="hint">— ${n(op)} message${n(op) === 1 ? "" : "s"}</span></li>`).join("")}</ul>
      ${F.ctx?.length ? `<h3>Inside</h3><div class="links">${ctxText(F)}</div>` : ""}`;
  }
  function eachRowUI(rows, fn) { for (const it of rows) { fn(it); if (it.ops) for (const op of it.ops) eachRowUI(op.rows, fn); } }
  function showRef(r) {
    const T = SEQS[r.ref];
    panel.innerHTML = `<span class="kind"><i></i>Interaction use · ref</span>
      <h2>${esc(r.n)}</h2>
      <p>${esc(r.say || "")}</p>
      ${r.d ? `<p class="hint">${esc(r.d)}</p>` : ""}
      <p class="hint">${esc(T.sub)}</p>
      ${codeList(r.code)}
      ${r.ctx?.length ? `<h3>Inside</h3><div class="links">${ctxText(r)}</div>` : ""}
      <button class="drill" data-open="${r.ref}">Open “${esc(T.title)}” ›</button>`;
  }
  function showLegend() {
    S.legend = true;
    const arrow = (dash, mk, color) => `<svg viewBox="0 0 64 30"><line x1="2" y1="15" x2="60" y2="15" class="m-line" style="stroke:${color};${dash ? "stroke-dasharray:6 4;" : ""}marker-end:url(#${mk})"/></svg>`;
    panel.innerHTML = `<span class="kind"><i></i>Legend</span><h2>Notation</h2>
      <p class="hint">UML 2 sequence diagram notation, as used here.</p>
      <div class="legend">
        <svg viewBox="0 0 64 30"><rect class="pbox" x="4" y="2" width="56" height="20" rx="6"/><line class="life" x1="32" y1="22" x2="32" y2="30"/></svg><span><b>Participant and lifeline.</b> The column runs down through time. Bands group what runs in the browser, on the app server, and beyond.</span>
        ${arrow(false, "mk-call", "var(--fg)")}<span><b>Synchronous call</b> — the caller waits (an awaited function or HTTP request).</span>
        ${arrow(true, "mk-open", "var(--muted)")}<span><b>Return</b> — the answer, or a thrown error.</span>
        ${arrow(false, "mk-async", "var(--fg)")}<span><b>Asynchronous message</b> — fire and forget: an event, a callback, a fire-and-forget write.</span>
        ${arrow(false, "mk-call-net", "var(--net)")}<span><b>Blue</b> — crosses the network: browser ↔ app server, or app server ↔ upstream.</span>
        <svg viewBox="0 0 64 30"><line class="life" x1="20" y1="0" x2="20" y2="30"/><path class="m-line" d="M22,6 H48 V18 H27" style="marker-end:url(#mk-call)"/></svg><span><b>Self call</b> — work done inside one participant.</span>
        <svg viewBox="0 0 64 30"><line class="life" x1="32" y1="0" x2="32" y2="30"/><rect class="act" x="27" y="4" width="10" height="22"/></svg><span><b>Activation bar</b> — busy handling a call.</span>
        <svg viewBox="0 0 64 30"><rect class="fr" x="2" y="2" width="60" height="26" rx="3"/><path class="fr-tag" d="M2,2 h28 v9 l-6,6 H2 z"/><text class="fr-op" x="6" y="13" style="font-size:9px">alt</text></svg><span><b>Combined fragment.</b> <code>alt</code> alternatives · <code>opt</code> optional · <code>loop</code> repeats · <code>par</code> in parallel · <code>break</code> ends the enclosing fragment. Guards are in [brackets]; dashed lines separate operands.</span>
        <svg viewBox="0 0 64 30"><rect class="ref-box" x="2" y="2" width="60" height="26" rx="3"/><path class="fr-tag" d="M2,2 h24 v8 l-5,5 H2 z"/><text class="fr-op" x="5" y="12" style="font-size:9px">ref</text></svg><span><b>Interaction use (ref)</b> — the steps are drawn in another diagram; double-click to open it.</span>
      </div>`;
  }
  panel.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.copy) {
      navigator.clipboard?.writeText(t.dataset.copy).then(() => { t.classList.add("ok"); setTimeout(() => t.classList.remove("ok"), 1200); });
    } else if (t.dataset.sel) {
      const [k, id] = t.dataset.sel.split(":");
      select(k, id, true);
      if (k === "f") { const F = find(S.cur, id); reveal(F.y0 - 10, Math.min(F.y1, F.y0 + 200), F.x0, F.x1); }
    } else if (t.dataset.open) {
      stopWalk(true);
      open(t.dataset.open);
    } else if (t.dataset.scen) {
      $("#scen").value = t.dataset.scen;
      startWalk(true);
    }
  });
  $("#legendBtn").onclick = () => (S.legend ? (S.legend = false, S.sel ? select(S.sel.k, S.sel.id) : showHome()) : showLegend());

  /* ---------- export ---------- */
  $("#dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([toMermaid(S.cur)], { type: "text/plain" }));
    a.download = `readaloud-${S.cur}.mmd`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("#copyMmd").onclick = (e) => {
    const b = e.currentTarget;
    navigator.clipboard?.writeText(toMermaid(S.cur)).then(() => { b.textContent = "Copied ✓"; setTimeout(() => (b.textContent = "Copy Mermaid"), 1400); });
  };

  /* ---------- walkthrough ---------- */
  const say = (k, t) => { $("#sayk").textContent = k; $("#sayt").textContent = t; $("#sayt").classList.toggle("hint", !k); };
  function describe(it) {
    if (it.f) return `${P[it.f].n} → ${P[it.to].n}: ${it.n}`;
    return it.n || "";
  }
  function startWalk(autoplay) {
    stopWalk(false);
    const base = S.cur, sc = $("#scen").value;
    S.walk = { base, sc, steps: buildSteps(base, sc, $("#follow").checked), i: -1, timer: null };
    applyWalkClasses();
    if (autoplay) play(); else go(0);
  }
  function stopWalk(clear) {
    const w = S.walk;
    if (!w) return;
    clearTimeout(w.timer);
    w.timer = null;
    $("#play").textContent = "▶ Play";
    if (clear) {
      S.walk = null;
      $("#crumb").innerHTML = "";
      say("", "Pick a walkthrough and press Play, or click any arrow.");
      if (S.cur !== w.base) open(w.base);
      applyWalkClasses();
    }
  }
  function play() {
    const w = S.walk;
    if (!w) return startWalk(true);
    $("#play").textContent = "❚❚ Pause";
    const next = () => {
      if (!S.walk || w !== S.walk) return;
      if (w.i >= w.steps.length - 1) { w.timer = null; $("#play").textContent = "▶ Play"; say("Done", `End of “${scenName(w)}”.`); return; }
      go(w.i + 1);
      const st = w.steps[w.i];
      w.timer = setTimeout(next, 900 + Math.min(2800, (st.say || "").length * 30));
    };
    next();
  }
  const scenName = (w) => SEQS[w.base].scenarios.find((s) => s.id === w.sc)?.n || "";
  function go(i) {
    const w = S.walk;
    if (!w || i < 0 || i >= w.steps.length) return;
    const forward = i === w.i + 1;
    w.i = i;
    const st = w.steps[i];
    if (st.diag !== S.cur) {
      open(st.diag, true);
      if (st.diag === w.base) $("#scen").value = w.sc;
      else $("#scen").innerHTML = `<option value="">↳ inside “${esc(scenName(w))}”</option>`;
    }
    applyWalkClasses();
    const it = find(st.diag, st.id);
    $("#crumb").innerHTML = st.crumb.map((d, k) => k === st.crumb.length - 1 ? `<b>${esc(SEQS[d].title)}</b>` : esc(SEQS[d].title)).join(" › ");
    say(`${i + 1}/${w.steps.length}`, st.say || describe(it));
    if (it.f) {
      select("m", it.id, false);
      reveal(it.y - 30, (it.y2 || it.y) + 12, Math.min(it.x1, it.x2), Math.max(it.x1, it.x2, it.xr ?? it.x1));
      if (forward) token(it);
    } else if (it.ref) {
      select("r", it.id);
      reveal(it.y0 - 10, it.y1 + 10, it.x0, it.x1);
    } else {
      select("f", it.id);
      const op = it.ops[st.op ?? 0];
      reveal(op.y0 - 10, Math.min(op.y1, op.y0 + 160), it.x0, it.x1);
    }
  }
  /** Which items the current walkthrough touches in this diagram: the rest is dimmed. */
  function applyWalkClasses() {
    root.querySelectorAll(".off,.visited,.active").forEach((n) => n.classList.remove("off", "visited", "active"));
    const w = S.walk;
    if (!w) return;
    const here = w.steps.map((s, i) => ({ ...s, i })).filter((s) => s.diag === S.cur);
    if (!here.length) return;
    const on = new Set(here.map((s) => s.id));
    root.querySelectorAll('[data-k="m"],[data-k="r"]').forEach((n) => { if (!on.has(n.dataset.id)) n.classList.add("off"); });
    // Only the current visit to this diagram counts as visited.
    const cur = w.steps[w.i];
    for (const s of here) {
      if (s.i > w.i || (cur && cur.diag === S.cur && s.crumb.length !== cur.crumb.length)) continue;
      root.querySelectorAll(`[data-k="${s.ref ? "r" : s.op !== undefined ? "f" : "m"}"][data-id="${s.id}"]`).forEach((n) => n.classList.add(s.i === w.i ? "active" : "visited"));
    }
  }
  function token(m) {
    const pts = pointsOf(m);
    root.querySelectorAll(".token").forEach((n) => n.remove());
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("r", 6);
    c.setAttribute("class", "token" + (isNet(m) ? " net" : ""));
    root.appendChild(c);
    const segs = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
    const total = segs.reduce((a, b) => a + b, 0) || 1;
    const t0 = performance.now(), dur = 520;
    const tick = (t) => {
      let d = Math.min(1, (t - t0) / dur) * total, k = 0;
      while (k < segs.length - 1 && d > segs[k]) d -= segs[k++];
      const f = segs[k] ? d / segs[k] : 1;
      c.setAttribute("cx", pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f);
      c.setAttribute("cy", pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f);
      if (t - t0 < dur) requestAnimationFrame(tick);
      else setTimeout(() => c.remove(), 120);
    };
    requestAnimationFrame(tick);
  }
  $("#play").onclick = () => {
    const w = S.walk;
    if (w && w.timer) { stopWalk(false); return; }
    if (w && w.i < w.steps.length - 1) play();
    else startWalk(true);
  };
  $("#step").onclick = () => { if (!S.walk) startWalk(false); else { stopWalk(false); go(S.walk.i + 1); } };
  $("#back").onclick = () => { if (S.walk) { stopWalk(false); go(S.walk.i - 1); } };
  $("#reset").onclick = () => stopWalk(true);
  $("#scen").onchange = () => stopWalk(true);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("select,input,textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); $("#step").click(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); $("#back").click(); }
    else if (e.key === " ") { e.preventDefault(); $("#play").click(); }
    else if (e.key === "Escape") { stopWalk(true); S.sel = null; markSel(); showHome(); }
    else if (e.key === "0") fit();
    else if (e.key === "+" || e.key === "=") $("#zin").click();
    else if (e.key === "-") $("#zout").click();
    else if (e.key === "ArrowDown") { e.preventDefault(); S.ty -= 80; apply(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); S.ty += 80; apply(); }
  });
  window.addEventListener("resize", apply);

  /* ---------- start ---------- */
  const start = location.hash.slice(1);
  open(SEQS[start] ? start : KEYS[0]);
})();
</script>
</body>
</html>
